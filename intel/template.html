<title>겸손몰 후기 인텔리전스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<style>
/* v5 한 화면 판(2026-10-23 이석원 원칙): 큰 숫자 왼쪽 위 · 가로로 넓게, 세로 스크롤 최소 · 한 페이지(탭 없음, 상세는 오른쪽 서랍)
   · 문장 대신 짧은 라벨 · 촘촘하게 · 로고 작게. 디자인은 옛 대시보드 그대로(검은 바탕·금색·Paperlogy·Playfair). 칭찬=초록, 불만=빨강, 보통=회색, 갈림=노랑.
   레이아웃: 위 필터 한 줄 → 숫자 한 줄(첫 칸이 가장 큼) → 세 칸(세분류 | 상품 표 | 최근 불만) → 두 칸(히트맵 | 월별) */
@font-face{font-family:'Paperlogy';font-weight:400;src:url('fonts/Paperlogy-4Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Paperlogy';font-weight:500;src:url('fonts/Paperlogy-5Medium.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Paperlogy';font-weight:600;src:url('fonts/Paperlogy-6SemiBold.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Paperlogy';font-weight:700;src:url('fonts/Paperlogy-7Bold.ttf') format('truetype');font-display:swap}
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#121317; --sunken:#1c1d22; --raise:#18191e;
  --ink:#e8e9ee; --ink-2:#b4b7c1; --ink-3:#8f929f; --line:#1f2026; --line-2:#2c2e35;
  --accent:#cc9166; --accent-ink:#000000; --accent-soft:#241a12;
  --good:#22c55e; --neutral:#6e717d; --bad:#ef4444; --mixed:#d4a017;
  --good-soft:#0f2a19; --bad-soft:#3a1414;
  --font-display:'Playfair Display','Paperlogy',ui-serif,Georgia,serif;
  --font-body:'Paperlogy','Inter','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:16px;
  --r:8px; --gap:10px; --top:48px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.45;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)} .num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* ── 위 필터 한 줄 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line-2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:7px;
  display:flex;align-items:center;gap:14px;min-height:var(--top)}
.logo{font-family:var(--font-display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--ink-2)}
.logo b{color:var(--accent);font-weight:700}
.scope{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;align-items:center}
.scope::-webkit-scrollbar{display:none}
.pill{min-height:30px;padding:3px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm);white-space:nowrap}
.pill:hover{color:var(--ink);border-color:var(--ink-3)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.scope select{min-height:30px;padding:3px 8px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink-2);font-size:var(--fs-sm);max-width:150px}
.scope select.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.sep{width:1px;align-self:stretch;background:var(--line-2);flex:0 0 1px;margin-block:4px}
.periods{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line-2);border-radius:99px;padding:2px;flex:0 0 auto}
.periods button{min-height:26px;padding:2px 10px;border:0;border-radius:99px;background:none;cursor:pointer;color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap}
.periods button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);font-weight:700}
.search{flex:0 1 220px;min-width:120px}
.search input{width:100%;min-height:32px;padding:4px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:var(--fs-sm)}
.search input::placeholder{color:var(--ink-3)}
.icbtn{min-height:30px;min-width:30px;padding:3px 9px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm);white-space:nowrap}
.icbtn.warn{background:var(--bad-soft);border-color:transparent;color:var(--ink);font-weight:600}
.stamp{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}

/* ── 본문 ── */
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 90px;display:flex;flex-direction:column;gap:var(--gap)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:0 0 auto}
.ph h2{font-size:var(--fs-md);font-weight:700;margin:0;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.ph .meta{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.scroll{overflow-y:auto;min-height:0;flex:1 1 auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* 숫자 한 줄: 첫 칸이 가장 크다 */
.kpis{display:grid;grid-template-columns:minmax(210px,1.7fr) repeat(6,minmax(0,1fr));gap:var(--gap)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.kpi .k{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-family:var(--font-display);font-size:26px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-family:var(--font-body);font-size:var(--fs-sm);font-weight:500;color:var(--ink-3);margin-left:2px}
.kpi .d{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.kpi.hero{background:var(--accent-soft);border-color:transparent;padding:10px 18px}
.kpi.hero .v{font-size:46px;color:var(--ink)}
.kpi.hero .k{color:var(--accent);font-weight:600;font-size:var(--fs-sm)}
.kpi .v.g{color:var(--good)} .kpi .v.b{color:var(--bad)}

.dl{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.good{color:var(--good)} .dl.bad{color:var(--bad)} .dl.flat{color:var(--ink-3);font-weight:500}
.dl small{font-weight:500;opacity:.85}

/* 세 칸 */
.main3{display:grid;grid-template-columns:minmax(240px,270px) minmax(0,1fr) minmax(280px,340px);gap:var(--gap);height:clamp(400px,calc(100vh - 300px),600px)}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.stack>.panel{flex:1 1 0}
.main2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:var(--gap)}

/* 세분류 막대 */
.ld{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ld li{display:grid;grid-template-columns:66px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:var(--fs-sm)}
.ld .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar{height:10px;background:var(--sunken);border-radius:3px;overflow:hidden;display:block}
.bar i{display:block;height:100%;border-radius:0 3px 3px 0}
.bar i.g{background:var(--good)} .bar i.b{background:var(--bad)}
.ld .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:var(--fs-xs)}
.ld .ex{grid-column:2/-1;font-size:var(--fs-xs);color:var(--ink-3);margin-top:-2px;display:flex;gap:6px;align-items:flex-start}

.rsn{display:flex;flex-direction:column;gap:7px}
.rsn>div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:baseline}
.rsn .rk{font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.rsn .rk small{display:block;font-weight:400;color:var(--ink-3);font-size:var(--fs-xs)}
.rsn .rv{display:flex;flex-wrap:wrap;gap:4px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);padding:1px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;background:var(--surface);line-height:1.6}
.chip.no{font-weight:600;background:var(--sunken);border-color:transparent}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--ink)}
button.chip{cursor:pointer} button.chip:hover{border-color:var(--ink-3)}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:0 0 8px}
.dot.g{background:var(--good)} .dot.n{background:var(--neutral)} .dot.b{background:var(--bad)} .dot.m{background:var(--mixed)}

/* 상품 표 */
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
.pt th{position:sticky;top:0;z-index:1;background:var(--surface);font-weight:600;color:var(--ink-3);font-size:var(--fs-xs);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.pt th button{all:unset;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.pt th button:hover,.pt th button[aria-pressed="true"]{color:var(--accent)}
.pt td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.pt td.r,.pt th.r{text-align:right;font-variant-numeric:tabular-nums}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover td{background:var(--raise)}
.pt tbody tr.sel td{background:var(--accent-soft)}
.pcell{display:flex;align-items:center;gap:8px;min-width:0;max-width:220px}
.pcell .nm{overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)}
.pcell .no{font-size:var(--fs-xs);color:var(--ink-3);flex:0 0 auto}
.sbar{display:flex;gap:1px;height:8px;border-radius:2px;overflow:hidden;width:60px;background:var(--sunken)}
.sbar i{display:block;height:100%}
.sbar i.g{background:var(--good)} .sbar i.n{background:var(--neutral)} .sbar i.b{background:var(--bad)}
.ck{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}

.thumb{border-radius:5px;object-fit:cover;background:var(--sunken);flex:0 0 auto;vertical-align:middle;border:2px solid var(--line-2)}
.thumb.ph{display:inline-block}

/* 최근 불만 · 검색 결과 */
.feed{display:flex;flex-direction:column}
.fi{display:flex;flex-direction:column;gap:3px;padding:7px 2px;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--ink-3)}
.fi .s{font-size:var(--fs-sm);color:var(--ink);display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.ext{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;border-radius:5px;color:var(--ink-3);border:1px solid var(--line-2)}
.ext:hover{color:var(--accent);border-color:var(--accent)}
mark{background:var(--accent);color:var(--accent-ink);border-radius:2px;padding:0 2px}
.more{align-self:center;min-height:30px;padding:3px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;font-size:var(--fs-sm);color:var(--ink-2);margin-top:6px}
.empty{padding:18px 6px;text-align:center;color:var(--ink-3);font-size:var(--fs-sm)}

/* 히트맵 */
.hm-wrap{overflow:auto;min-height:0}
.hm{border-collapse:separate;border-spacing:3px;font-size:var(--fs-xs);width:auto}
.hm th{background:none;padding:2px 4px;color:var(--ink-3);font-weight:600;text-align:center;white-space:nowrap}
.hm th.rl{text-align:left;min-width:150px;max-width:200px}
.hm th.rl button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:196px;font-size:var(--fs-sm)}
.hm th.rl button:hover{text-decoration:underline}
.hm th.rl.on button{color:var(--accent)}
.hm td{width:44px;min-width:44px;height:26px;text-align:center;border-radius:4px;padding:0;font-variant-numeric:tabular-nums;font-weight:700;color:#fff}
.hm td.z{background:var(--sunken);color:var(--ink-3);font-weight:400}
.seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line-2);border-radius:99px;padding:2px}
.seg button{min-height:22px;padding:1px 9px;border:0;border-radius:99px;background:none;cursor:pointer;color:var(--ink-3);font-size:var(--fs-xs)}
.seg button[aria-pressed="true"]{background:var(--sunken);color:var(--ink);font-weight:700}
.lg{display:flex;gap:10px;font-size:var(--fs-xs);color:var(--ink-3);align-items:center;white-space:nowrap}
.lg span{display:inline-flex;gap:4px;align-items:center}

/* 월별 */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:420px}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:var(--fs-sm);line-height:1.45;max-width:280px;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}

/* 오른쪽 서랍(상품 상세·비교·확인 대기·용어) — 페이지를 떠나지 않는다 */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(760px,100vw);background:var(--bg);border-left:1px solid var(--line-2);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 40px rgba(0,0,0,.5)}
.drawer.wide{width:min(1180px,100vw)}
.dh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.dh h2{margin:0;font-size:var(--fs-lg);font-weight:700;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:var(--gap)}
.db>*{flex:0 0 auto}
.pd-head{display:flex;gap:14px;align-items:center}
.pd-head .thumb{border-radius:10px;border-width:3px}
.facts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}
.mk .kpi .v{font-size:22px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.ins{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:var(--fs-md);color:var(--ink)}
.quote{border-left:3px solid var(--line-2);padding:1px 0 1px 10px;display:flex;flex-direction:column;gap:2px}
.quote.g{border-left-color:var(--good)} .quote.b{border-left-color:var(--bad)}
.quote .s{font-weight:600;font-size:var(--fs-sm);display:flex;gap:6px;justify-content:space-between}
.quote .c{color:var(--ink-2);font-size:var(--fs-sm)}
.quote .m{font-size:var(--fs-xs);color:var(--ink-3)}
.quotes{display:flex;flex-direction:column;gap:10px}
.cgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:var(--gap);overflow-x:auto}
.ccol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ccol h3{margin:0;font-size:var(--fs-xs);color:var(--ink-3);font-weight:500}
.gl{margin:0;display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;font-size:var(--fs-sm)}
.gl dt{font-weight:700} .gl dd{margin:0;color:var(--ink-2)}

.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--ink);color:var(--bg);border-radius:12px;padding:7px 8px 7px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:var(--fs-sm);max-width:calc(100vw - 32px)}
.cmpbar button{min-height:32px;padding:3px 12px;border-radius:8px;border:0;cursor:pointer;font-weight:700;font-size:var(--fs-sm)}
.cmpbar .go{background:var(--accent);color:var(--accent-ink)}
.cmpbar .clr{background:transparent;color:var(--bg);border:1px solid rgba(0,0,0,.25)}

@media (max-width:1280px){.kpis{grid-template-columns:minmax(190px,1.5fr) repeat(3,minmax(0,1fr))}.kpi.x{display:none}}
@media (max-width:1100px){
  .main3{grid-template-columns:minmax(240px,280px) minmax(0,1fr);height:auto}
  .main3>.stack:first-child{height:clamp(440px,calc(100vh - 190px),640px)}
  .main3>.tblp{height:clamp(440px,calc(100vh - 190px),640px)}
  .main3>.feedp{grid-column:1/-1;max-height:420px}
  .main2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px}
  .scope{order:3;flex:1 1 100%}
  .search{flex:1 1 140px}
  .stamp{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero{grid-column:1/-1} .kpi.x{display:none}
  .main3{grid-template-columns:minmax(0,1fr)}
  .main3>.stack:first-child,.main3>.tblp{height:auto}
  .stack>.panel{flex:0 0 auto}
  .kpi.hero .v{font-size:40px}
  .main3>.tblp{max-height:520px}
  .hide-sm{display:none}
  .mk{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .gl{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{display:flex;flex-direction:column;gap:12px;width:min(300px,100%);text-align:center}
.gate .name{font-family:var(--font-display);font-size:26px;font-weight:700}
.gate input{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:var(--fs-lg);text-align:center}
.gate input.err{border-color:var(--bad)}
.gate button{min-height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.gate .msg{min-height:1.4em;font-size:var(--fs-sm);color:var(--ink-2)}
</style>

<header class="top">
  <div class="logo">겸손몰 <b>후기</b></div>
  <nav class="scope" id="scope" aria-label="범위"></nav>
  <div class="periods" role="group" aria-label="기간" id="periods"></div>

<div class="gate" id="gate" hidden><form id="gate-form" autocomplete="off"><div class="name">겸손몰 후기</div><label class="muted" for="gate-input">비밀번호</label><input id="gate-input" type="password" inputmode="text" required><button type="submit">들어가기</button><div class="msg" id="gate-msg" aria-live="polite"></div></form></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
// 입장 잠금(실제 사이트에서만).
const G = window.__GATE__;
if (G) {
  let passed = false; try { passed = sessionStorage.getItem('_nh_gate') === '1'; } catch (e) {}
  if (!passed) {
    const gate = document.getElementById('gate'), inp = document.getElementById('gate-input');
    gate.hidden = false; setTimeout(() => inp.focus(), 50);
    document.getElementById('gate-form').addEventListener('submit', e => {
      e.preventDefault();
      if (inp.value === G.g || inp.value === G.a) { try { sessionStorage.setItem('_nh_gate', '1'); } catch (e) {} gate.hidden = true; }
      else { inp.value = ''; inp.classList.add('err'); document.getElementById('gate-msg').textContent = '비밀번호가 맞지 않습니다.'; inp.focus(); }
    });
  }
}
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta, P = D.products;
const byKey = Object.fromEntries(P.map(p => [p.key, p]));
const PI = new Map(P.map((p, i) => [p, i]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const SENT = ['칭찬', '보통', '불만'], SK = ['g', 'n', 'b'];
const INT_LABEL = {'교환·반품':'교환·AS', '문의':'문의', '제품제안':'제안', '재구매희망':'재구매', '양도·거래':'거래'};
const INT_SUB = {'교환·반품':'바꾼 이유', '문의':'물은 것', '제품제안':'바꿔 달라', '재구매희망':'또 사는 이유'};
const REASON_INTS = ['교환·반품', '문의', '제품제안', '재구매희망'];
const tagName = t => t.replace(/^#/, '');
const total = s => s[0] + s[1] + s[2];
const goodShare = p => pct(p.sent[0], total(p.sent));
const badShare = p => pct(p.sent[2], total(p.sent));
const TAGS = M.tags, INTS = M.intents || [];
const mallLink = p => p.pid ? `https://nonohumble.com/product/detail.html?product_no=${p.pid}` : '';
const reviewLink = id => `https://nonohumble.com/article/%EC%83%81%ED%92%88-%EC%82%AC%EC%9A%A9%ED%9B%84%EA%B8%B0/4/${id}/`;
const EXT_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ext = href => href ? `<a class="ext" href="${esc(href)}" target="_blank" rel="noopener" aria-label="원문" title="원문">${EXT_SVG}</a>` : '';
const ymdStr = n => { const d = String(n); return `${d.slice(2, 4)}.${d.slice(4, 6)}.${d.slice(6)}`; };
const jo = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b; };
const sortObj = o => Object.fromEntries(Object.entries(o).sort((a, b) => b[1] - a[1]));

// ── 상태 ──
const PERIODS = [['30', '30일'], ['90', '90일'], ['365', '1년'], ['all', '전체']];
const st = { period: '90', scope: { t: 'all', k: '' }, sort: 'n', q: '', show: 40, hm: 'product', cmp: [] };
const ANCHOR = (M.updated || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
const ymdMinus = days => { const d = new Date(ANCHOR + 'T00:00:00'); d.setDate(d.getDate() - days); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const cutoff = () => st.period === 'all' ? 0 : ymdMinus(+st.period);
const periodLabel = () => ({ '30': '최근 30일', '90': '최근 90일', '365': '최근 1년', all: '전체 기간' })[st.period];

// 고른 기간으로 상품별 숫자를 다시 센다(D.R = 후기 축약 목록). it = 요청 종류 → 세분류 → 개수
function applyPeriod() {
  const c = cutoff(), acc = P.map(() => ({ n: 0, sent: [0, 0, 0], pos: {}, neg: {}, it: {}, itN: {} }));
  for (const r of D.R) {
    if (r[1] < c) continue;
    const a = acc[r[0]]; a.n++;
    for (const sg of r[5]) {
      a.sent[sg[0]]++;
      for (const ti of sg[1]) { const t = TAGS[ti]; if (sg[0] === 0) a.pos[t] = (a.pos[t] || 0) + 1; if (sg[0] === 2) a.neg[t] = (a.neg[t] || 0) + 1; }
      if (sg[2] >= 0) { const k = INTS[sg[2]]; a.itN[k] = (a.itN[k] || 0) + 1; const o = a.it[k] = a.it[k] || {}; for (const ti of sg[1]) o[TAGS[ti]] = (o[TAGS[ti]] || 0) + 1; }
    }
  }
  P.forEach((p, i) => { const a = acc[i]; Object.assign(p, { n: a.n, sent: a.sent, pos: sortObj(a.pos), neg: sortObj(a.neg), it: a.it, itN: a.itN }); });
}
const visible = p => p.n > 0;
const inScope = p => st.scope.t === 'all' || (st.scope.t === 'cat' ? p.cats.includes(st.scope.k) : p.partners.includes(st.scope.k));
const scoped = () => P.filter(p => visible(p) && inScope(p));
const scopeLabel = () => st.scope.t === 'all' ? '전체' : st.scope.t === 'cat' ? st.scope.k : `파트너사 · ${st.scope.k}`;

// ── 주간 증감: 이번 주 = 기준일 포함 최근 7일, 지난주 = 그 전 7일(기간 선택과 무관) ──
const W0 = ymdMinus(6), W1 = ymdMinus(13);
const WK = P.map(() => ({ g: 0, b: 0, gp: 0, bp: 0, n: 0, np: 0 }));
for (const r of D.R) {
  if (r[1] < W1) continue;
  const w = WK[r[0]], cur = r[1] >= W0;
  cur ? w.n++ : w.np++;
  for (const sg of r[5]) { if (sg[0] === 0) cur ? w.g++ : w.gp++; if (sg[0] === 2) cur ? w.b++ : w.bp++; }
}
const wkOf = ps => ps.reduce((a, p) => { const w = WK[PI.get(p)]; for (const k in a) a[k] += w[k]; return a; }, { g: 0, b: 0, gp: 0, bp: 0, n: 0, np: 0 });
// 칭찬은 늘면 초록, 불만은 늘면 빨강
function delta(cur, prev, upIsGood = true, neutral = false) {
  const d = cur - prev;
  if (!d) return `<span class="dl flat" title="지난주와 같음">— 0</span>`;
  const cls = neutral ? 'flat' : ((d > 0) === upIsGood ? 'good' : 'bad'), p = prev >= 5 ? `${d > 0 ? '+' : ''}${Math.round(d / prev * 100)}%` : '';
  return `<span class="dl ${cls}" title="지난주 ${prev} → 이번 주 ${cur}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}${p ? ` <small>${p}</small>` : ''}</span>`;
}

// ── 상태 색: 칭찬이 많으면 초록, 불만이 많으면 빨강, 진할수록 한쪽으로 쏠림 ──
function tone(s) {
  const t = s[0] + s[2]; if (!t) return 'var(--line-2)';
  const bal = (s[0] - s[2]) / t, k = Math.round(25 + 75 * Math.min(1, Math.abs(bal)));
  return `color-mix(in srgb, ${bal >= 0 ? 'var(--good)' : 'var(--bad)'} ${k}%, var(--line-2))`;
}
const thumb = (p, size = 28) => p.img
  ? `<img class="thumb" src="${esc(p.img)}" width="${size}" height="${size}" loading="lazy" referrerpolicy="no-referrer" alt="" style="border-color:${tone(p.sent)}" onerror="this.style.visibility='hidden'">`
  : `<span class="thumb ph" style="width:${size}px;height:${size}px;border-color:${tone(p.sent)}" aria-hidden="true"></span>`;
const sbar = s => { const t = total(s) || 1, a = `칭찬 ${pct(s[0], t)}% · 보통 ${pct(s[1], t)}% · 불만 ${pct(s[2], t)}%`;
  return `<div class="sbar" role="img" aria-label="${a}" title="${a}">${s.map((v, i) => v ? `<i class="${SK[i]}" style="width:${v / t * 100}%"></i>` : '').join('')}</div>`; };

// ── 묶음 합치기 ──
function agg(ps) {
  const a = { n: 0, sent: [0, 0, 0], pos: {}, neg: {}, it: {}, itN: {}, ex: {} }, best = {};
  ps.forEach(p => {
    a.n += p.n; p.sent.forEach((v, i) => a.sent[i] += v);
    for (const [k, v] of Object.entries(p.pos)) a.pos[k] = (a.pos[k] || 0) + v;
    for (const [k, v] of Object.entries(p.neg)) a.neg[k] = (a.neg[k] || 0) + v;
    for (const [k, v] of Object.entries(p.itN)) a.itN[k] = (a.itN[k] || 0) + v;
    for (const [k, o] of Object.entries(p.it)) { const t = a.it[k] = a.it[k] || {}; for (const [x, v] of Object.entries(o)) t[x] = (t[x] || 0) + v; }
    Object.entries(p.tex || {}).forEach(([k, e]) => ['g', 'b'].forEach(s => { const v = (s === 'g' ? p.pos : p.neg)[k] || 0;
      if (e[s] && v > (best[k + s] || 0)) { best[k + s] = v; (a.ex[k] = a.ex[k] || {})[s] = e[s]; } }));
  });
  a.pos = sortObj(a.pos); a.neg = sortObj(a.neg); a.wk = wkOf(ps);
  return a;
}
const groupsBy = kind => { const m = {}; P.filter(visible).forEach(p => (kind === 'cat' ? (p.cats.length ? p.cats : ['분류 없음']) : p.partners).forEach(c => (m[c] = m[c] || []).push(p))); return m; };
const tagStats = (pos, neg) => [...new Set([...Object.keys(pos || {}), ...Object.keys(neg || {})])].map(k => ({ k, name: tagName(k), g: (pos || {})[k] || 0, b: (neg || {})[k] || 0 }));

// ── 조각들 ──
function ldList(rows, k, n, ex) {
  const arr = rows.filter(r => r[k]).sort((a, b) => b[k] - a[k]).slice(0, n), max = Math.max(1, ...arr.map(r => r[k]));
  if (!arr.length) return '<div class="empty">없음</div>';
  return `<ul class="ld">${arr.map(r => { const e = ex && ((ex[r.k] || {})[k] || [])[0];
    return `<li title="${esc(r.name)} ${k === 'g' ? '칭찬' : '불만'} ${r[k]}${e ? ' · “' + esc(e.s) + '”' : ''}"><span class="nm">${esc(r.name)}</span><span class="bar"><i class="${k}" style="width:${r[k] / max * 100}%"></i></span><span class="n">${fmt(r[k])}</span>${ex && e ? `<span class="ex">“${esc(e.s)}” ${ext(e.link)}</span>` : ''}</li>`; }).join('')}</ul>`;
}
function reasonsHtml(a, n = 4) {
  const rows = REASON_INTS.filter(k => a.itN[k]).map(k => {
    const tags = Object.entries(a.it[k] || {}).sort((x, y) => y[1] - x[1]).slice(0, n);
    const cls = k === '교환·반품' ? 'bad' : k === '재구매희망' ? 'good' : '';
    return `<div><div class="rk">${esc(INT_LABEL[k])} <span class="num">${fmt(a.itN[k])}</span><small>${INT_SUB[k]}</small></div><div class="rv">${tags.length ? tags.map(([t, v]) => `<span class="chip ${cls}">${esc(tagName(t))} ${fmt(v)}</span>`).join('') : '<span class="muted" style="font-size:var(--fs-xs)">세분류 없음</span>'}</div></div>`;
  });
  return rows.length ? `<div class="rsn">${rows.join('')}</div>` : '<div class="empty">없음</div>';
}
function kpi(k, v, unit, d, cls = '', vcls = '') {
  return `<div class="kpi ${cls}"><span class="k">${k}</span><span class="v ${vcls}">${v}${unit ? `<small>${unit}</small>` : ''}</span>${d ? `<span class="d">${d}</span>` : ''}</div>`;
}

// ── 히트맵: 행 × 세분류. 셀 색 = 칭찬/불만 쏠림, 진하기 = 이야기 수 ──
function heatmap(rows, cols = 11) {
  rows = rows.filter(r => r.a.n > 0);
  if (!rows.length) return '<div class="empty">없음</div>';
  const tot = {}; rows.forEach(r => tagStats(r.a.pos, r.a.neg).forEach(x => tot[x.k] = (tot[x.k] || 0) + x.g + x.b));
  const C = Object.keys(tot).sort((a, b) => tot[b] - tot[a]).slice(0, cols);
  const max = Math.max(1, ...rows.flatMap(r => C.map(c => (r.a.pos[c] || 0) + (r.a.neg[c] || 0))));
  const cell = (r, c) => { const g = r.a.pos[c] || 0, b = r.a.neg[c] || 0, t = g + b;
    if (!t) return `<td class="z">·</td>`;
    const bal = (g - b) / t, base = bal >= .2 ? 'var(--good)' : bal <= -.2 ? 'var(--bad)' : 'var(--mixed)', k = Math.round(30 + 65 * Math.sqrt(t / max));
    return `<td style="background:color-mix(in srgb, ${base} ${k}%, var(--sunken))" title="${esc(r.label)} · ${esc(tagName(c))}: 칭찬 ${g} · 불만 ${b}">${t}</td>`; };
  return `<div class="hm-wrap"><table class="hm"><thead><tr><th class="rl"></th>${C.map(c => `<th scope="col">${esc(tagName(c))}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr><th scope="row" class="rl${r.on ? ' on' : ''}"><button ${r.attr}>${r.thumb || ''}<span>${esc(r.label)}</span></button></th>${C.map(c => cell(r, c)).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// ── 월별 차트 ──
const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.classList.add('on'); const r = tip.getBoundingClientRect(); let L = x + 12, T = y + 12;
  if (L + r.width > innerWidth - 8) L = x - r.width - 12; if (T + r.height > innerHeight - 8) T = y - r.height - 12; tip.style.left = L + 'px'; tip.style.top = T + 'px'; }
const hideTip = () => tip.classList.remove('on');
function launchesOf(ps) { const m = {}, seen = new Set();
  ps.forEach(p => { if (!p.sale_start || seen.has(p.group)) return; seen.add(p.group); const k = p.sale_start.slice(0, 7); (m[k] = m[k] || []).push(p.pilot ? p.name : `${p.num} ${p.group.replace(/^\d+\s+/, '')}`); }); return m; }
function seriesOf(ps) {
  if (st.scope.t === 'all' && ps.length > 1) return M.monthly;
  const m = {}; ps.forEach(p => (p.series || []).forEach(r => { const o = m[r[0]] = m[r[0]] || [r[0], 0, 0, 0, 0]; for (let i = 1; i < 5; i++) o[i] += r[i]; }));
  return Object.values(m).sort((a, b) => a[0].localeCompare(b[0]));
}
function monthChart(rows, opt = {}) {
  const data = rows.slice(-(opt.last || 24));
  if (!data.length) return '<div class="empty">없음</div>';
  const W = 640, H = opt.h || 210, L = 34, R = 6, T = 16, B = 26, launches = opt.launches || {};
  const max = Math.max(...data.map(r => r[2] + r[3] + r[4]), 1);
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => max / s <= 4) || 1000, top = Math.ceil(max / step) * step;
  const bw = (W - L - R) / data.length, bar = Math.max(4, Math.min(22, bw - 3)), y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  const every = Math.max(1, Math.ceil(data.length / 8));
  data.forEach((r, i) => {
    const x = L + i * bw + (bw - bar) / 2; let base = 0;
    const parts = [[r[2], 'var(--good)'], [r[3], 'var(--neutral)'], [r[4], 'var(--bad)']].map(([v, c]) => { if (!v) return ''; const y1 = y(base + v), h = y(base) - y1; base += v; return `<rect x="${x}" y="${y1}" width="${bar}" height="${Math.max(h - .5, 0)}" fill="${c}"/>`; }).join('');
    const [yy, mm] = r[0].split('-');
    const lbl = i % every === 0 ? `<text x="${x + bar / 2}" y="${H - B + 15}" text-anchor="middle">${yy.slice(2)}.${+mm}</text>` : '';
    const ln = launches[r[0]] ? `<circle cx="${x + bar / 2}" cy="${T - 8}" r="3.5" fill="var(--accent)"/>` : '';
    const part = r[0] === ANCHOR.slice(0, 7), tt = r[2] + r[3] + r[4];
    const pl = part ? `<text x="${x + bar}" y="${y(tt) - 5}" text-anchor="end">진행 중</text>` : '';
    g += `${ln}${pl}<g class="mbar" data-i="${i}"${part ? ' opacity=".45"' : ''}>${parts}<rect x="${L + i * bw}" y="0" width="${bw}" height="${H - B}" fill="transparent"/></g>${lbl}`;
  });
  const id = 'c' + Math.random().toString(36).slice(2, 7);
  setTimeout(() => { const svg = document.getElementById(id); if (!svg) return;
    svg.querySelectorAll('.mbar').forEach(el => { const r = data[+el.dataset.i], t = r[2] + r[3] + r[4];
      const html = `<b>${r[0].replace('-', '년 ')}월${r[0] === ANCHOR.slice(0, 7) ? ' · 진행 중' : ''}</b><br>후기 ${fmt(r[1])} · 이야기 ${fmt(t)}<br>칭찬 ${fmt(r[2])} · 보통 ${fmt(r[3])} · 불만 ${fmt(r[4])}${launches[r[0]] ? `<br><span style="color:var(--accent)">● 판매 시작 ${launches[r[0]].map(esc).join(', ')}</span>` : ''}`;
      el.addEventListener('mousemove', e => showTip(html, e.clientX, e.clientY)); el.addEventListener('mouseleave', hideTip); }); });
  return `<div class="chart"><svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 이야기 수">${g}</svg></div>`;
}

// ── 상품 표 ──
const SORTS = {
  n: [(a, b) => b.n - a.n, '후기'],
  good: [(a, b) => (b.n >= 10) - (a.n >= 10) || goodShare(b) - goodShare(a), '칭찬%'],
  bad: [(a, b) => (b.n >= 10) - (a.n >= 10) || badShare(b) - badShare(a), '불만%'],
  wkb: [(a, b) => { const A = WK[PI.get(a)], B = WK[PI.get(b)]; return (B.b - B.bp) - (A.b - A.bp) || B.b - A.b; }, '이번 주 불만'],
};
function tableHtml(ps) {
  const rows = [...ps].sort(SORTS[st.sort][0]);
  const th = (k, cls = '') => `<th scope="col" class="${cls}"><button data-sort="${k}" aria-pressed="${st.sort === k}">${SORTS[k][1]}${st.sort === k ? ' ▾' : ''}</button></th>`;
  return rows.length ? `<table class="pt"><caption class="sr">상품별 후기</caption><thead><tr><th scope="col">상품</th>${th('n', 'r')}<th scope="col">반응</th>${th('bad', 'r')}${th('wkb', 'r')}<th scope="col" class="hide-sm">주요 불만</th><th scope="col"><span class="sr">비교</span></th></tr></thead>

function insights(rows) {

  return out;
}

  ];
  openDrawer('보는 법 · 용어', `<section class="panel"><dl class="gl">${T.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>
    <section class="panel"><div class="ph"><h2>읽을 때</h2></div><ul class="ins"><li>후기는 쓰고 싶은 사람만 씀 → 상품끼리·주마다 견주는 용도</li><li>후기 10건 미만 상품은 비율 순위에서 뒤로</li><li>AI 판정이라 틀린 것이 섞일 수 있음 → 리뷰쟁이에게 알려 주세요</li><li>제외: 테스트·추가구매 상품 ${fmt(M.excluded)}건 · ${esc(M.built)} 갱신</li></ul></section>`);
}

// ── 비교 막대 ──
function renderCmpBar() {
  const el = $('#cmpbar');
  if (!st.cmp.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span>비교 <b>${st.cmp.length}</b>/4</span><button class="go" data-compare ${st.cmp.length < 2 ? 'disabled style="opacity:.5"' : ''}>비교</button><button class="clr" data-cmp-clear>비우기</button>`;
}

// ── 이벤트 ──
document.addEventListener('click', e => {
  if (e.target.closest('#d-close') || e.target.id === 'scrim') return closeDrawer();
  if (e.target.matches('.ck')) { e.stopPropagation(); const k = e.target.dataset.cmp;
    st.cmp = st.cmp.includes(k) ? st.cmp.filter(x => x !== k) : st.cmp.length >= 4 ? (e.target.checked = false, st.cmp) : [...st.cmp, k];
    e.target.closest('tr').classList.toggle('sel', st.cmp.includes(k)); return renderCmpBar(); }
  const t = e.target.closest('[data-open],[data-scope],[data-period],[data-sort],[data-hm],[data-more],[data-compare],[data-cmp-clear],#help-btn,#queue-btn');
  if (!t) return;
  if (t.id === 'help-btn') return helpDrawer();
  if (t.id === 'queue-btn') return queueDrawer();
  if (t.dataset.compare !== undefined) return st.cmp.length >= 2 && compareDrawer();
  if (t.dataset.cmpClear !== undefined) { st.cmp = []; return render(); }
  if (t.dataset.open) return productDrawer(t.dataset.open);
  if (t.dataset.scope) { e.preventDefault(); const s = t.dataset.scope, k = t.dataset.key || '';
    st.scope = (s === 'all' || (st.scope.t === s && st.scope.k === k && t.classList.contains('pill'))) ? { t: 'all', k: '' } : { t: s, k };
    if (s !== 'all' && st.hm !== 'product' && t.closest('.hm')) st.hm = 'product';
    st.show = 40; closeDrawer(); renderTop(); return render(); }
  if (t.dataset.period) { st.period = t.dataset.period; applyPeriod(); renderTop(); return render(); }
  if (t.dataset.sort) { st.sort = t.dataset.sort; return render(); }
  if (t.dataset.hm) { st.hm = t.dataset.hm; return render(); }
  if (t.dataset.more !== undefined) { st.show += 40; return renderFeed(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#drawer').hidden) return closeDrawer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-open]')) { e.preventDefault(); productDrawer(e.target.dataset.open); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { st.q = e.target.value; st.show = 40; clearTimeout(window.__qT); window.__qT = setTimeout(renderFeed, 180); } });
document.addEventListener('change', e => { if (e.target.id === 'partner-sel') { const v = e.target.value; st.scope = v ? { t: 'partner', k: v } : { t: 'all', k: '' }; st.show = 40; renderTop(); render(); } });

applyPeriod(); renderTop(); render();
$('#stamp').textContent = `${ANCHOR.slice(5).replace('-', '.')} 08:00 · ${fmt(M.reviews)}건`;
if (M.queue) { const b = $('#queue-btn'); b.hidden = false; b.textContent = `확인 대기 ${fmt(M.queue)}`; }
})();
</script>
