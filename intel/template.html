<title>겸손몰 후기 인텔리전스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap">
<style>
/* 옛 대시보드 디자인 시스템(검은 바탕·금색 강조·Paperlogy·Playfair Display). 칭찬=초록, 불만=빨강, 보통=회색.
   레이아웃: 왼쪽 목차(+기간·비교) + 오른쪽 한 줄 본문. 세분류(무엇이 좋고 무엇이 문제인가)가 먼저, 비율은 뒤. */
@font-face{font-family:'Paperlogy';font-weight:400;src:url('fonts/Paperlogy-4Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Paperlogy';font-weight:500;src:url('fonts/Paperlogy-5Medium.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Paperlogy';font-weight:600;src:url('fonts/Paperlogy-6SemiBold.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Paperlogy';font-weight:700;src:url('fonts/Paperlogy-7Bold.ttf') format('truetype');font-display:swap}
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#121317; --sunken:#1c1d22;
  --ink:#e8e9ee; --ink-2:#b4b7c1; --ink-3:#8f929f; --line:#1c1d22; --line-2:#2c2e35;
  --accent:#cc9166; --accent-ink:#000000; --accent-soft:#241a12;
  --good:#22c55e; --neutral:#6e717d; --bad:#ef4444; --mixed:#d4a017;
  --good-soft:#0f2a19; --bad-soft:#3a1414;
  --font-display:'Playfair Display','Paperlogy',ui-serif,Georgia,serif;
  --font-body:'Paperlogy','Inter','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --fs-xs:13px; --fs-sm:14.5px; --fs-md:16px; --fs-lg:18.5px; --fs-xl:23px; --fs-2xl:30px; --fs-3xl:40px;
  --r:10px; --gap:16px;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)} .small{font-size:var(--fs-sm)}

.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:26px 14px 22px;display:flex;flex-direction:column;gap:20px}
.brand{padding:0 10px}
.brand .name{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;line-height:1.25}
.brand .sub{color:var(--ink-3);font-size:var(--fs-xs);margin-top:4px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu-label{font-size:var(--fs-xs);color:var(--ink-3);padding:0 10px 6px;letter-spacing:.04em}
.tab{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:8px 12px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-size:var(--fs-md)}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.tab .badge{font-size:var(--fs-xs);font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunken);color:var(--ink-2)}
.tab .badge.warn{background:var(--bad-soft);color:var(--ink)}
.periods{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px}
.periods button{min-height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm)}
.periods button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-3);line-height:1.6}

main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:30px 110px}
.wrap{max-width:1160px;display:flex;flex-direction:column;gap:26px}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:var(--fs-sm);color:var(--ink-3)}
h1{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:500;line-height:1.3;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:var(--fs-lg);font-weight:600;margin:0;line-height:1.4;text-wrap:balance}
.lead{font-size:var(--fs-lg);color:var(--ink-2);max-width:66ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head p{margin:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}

.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.fig .k{font-size:var(--fs-sm);color:var(--ink-2)}
.fig .v{font-family:var(--font-display);font-size:var(--fs-3xl);line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.fig .v small{font-family:var(--font-body);font-size:var(--fs-md);font-weight:500;color:var(--ink-2);margin-left:3px}
.fig .d{font-size:var(--fs-sm);color:var(--ink-3)}

/* 주간 증감(주식처럼) */
.dl{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.good{color:var(--good)} .dl.bad{color:var(--bad)} .dl.flat{color:var(--ink-3);font-weight:500}
.wk{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2);align-items:center}
.wk b{color:var(--ink);font-weight:600}

/* 반응 막대 */
.sbar{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;min-width:80px;background:var(--sunken)}
.sbar i{display:block;height:100%}
.sbar i.g{background:var(--good)} .sbar i.n{background:var(--neutral)} .sbar i.b{background:var(--bad)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 10px}
.dot.g{background:var(--good)} .dot.n{background:var(--neutral)} .dot.b{background:var(--bad)} .dot.m{background:var(--mixed)}

.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) 140px 54px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pname{display:flex;flex-direction:column;min-width:0}
.rank .pname button{all:unset;cursor:pointer;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.rank .pname button:hover{text-decoration:underline;text-underline-offset:3px}
.rank .why{font-size:var(--fs-sm);color:var(--ink-3)}
.rank .pct{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:2px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.chip.no{font-weight:600;background:var(--sunken);border-color:transparent}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--ink)}
button.chip{cursor:pointer}

.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:560px}
.chart text{fill:var(--ink-3);font-size:12px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:var(--fs-sm);line-height:1.5;max-width:280px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);color:var(--ink-3)}
.field input,.field select{min-height:42px;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:var(--fs-md);color:var(--ink);min-width:0}
.field input{width:min(300px,100%)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th{font-weight:600;color:var(--ink-2);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface)}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover td{background:var(--sunken)}
tbody tr:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pcell{display:flex;align-items:center;gap:10px;min-width:0}
.pcell b{font-weight:600;font-size:var(--fs-md);color:var(--ink)}
.pc-txt{display:flex;flex-direction:column;min-width:0;line-height:1.35}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;padding:15px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .when{font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .what{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .sum{font-size:17.5px;line-height:1.55;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.more{align-self:center;min-height:42px;padding:8px 22px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink)}
.verdict{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:var(--fs-sm);color:var(--ink-2)}
.ext{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:0 0 28px;border-radius:7px;color:var(--ink-3);border:1px solid var(--line-2)}
.ext:hover{color:var(--accent);border-color:var(--accent)}

.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px 6px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm)}
.facts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quotes{display:flex;flex-direction:column;gap:14px}
.quote{border-left:3px solid var(--line-2);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.quote.g{border-left-color:var(--good)} .quote.b{border-left-color:var(--bad)}
.quote .s{font-weight:600;font-size:17.5px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.quote .c{color:var(--ink-2);font-size:15.5px}
.quote .m{font-size:var(--fs-xs);color:var(--ink-3)}

.thumb{border-radius:9px;object-fit:cover;background:var(--sunken);flex:0 0 auto;vertical-align:middle;border:2px solid var(--line-2)}
.thumb.ph{display:inline-block}
.phead{display:flex;gap:18px;align-items:center}
.phead .thumb{border-radius:16px;border-width:4px}
.insight{background:var(--accent-soft);border-radius:var(--r);padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.insight h2{font-size:var(--fs-md);color:var(--ink-2)}
.insight ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;font-size:19.5px;line-height:1.55}
.ld{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ld-top{display:grid;grid-template-columns:84px minmax(0,1fr) 44px;gap:10px;align-items:center}
.ld-name{font-weight:600;font-size:17px}
.ld-bar{height:13px;background:var(--sunken);border-radius:4px;overflow:hidden;display:block}
.ld-bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.ld-bar i.g{background:var(--good)} .ld-bar i.b{background:var(--bad)}
.ld-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:var(--fs-sm)}
.ld-ex{display:flex;gap:6px;align-items:flex-start;margin:4px 0 0 94px;font-size:15.5px;color:var(--ink-2);line-height:1.5}
.reasons{display:flex;flex-direction:column;gap:12px}
.reason{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:baseline}
.reason .rk{font-weight:600;font-size:17px}
.reason .rk small{display:block;font-weight:400;color:var(--ink-3);font-size:var(--fs-sm)}
.reason .rv{display:flex;flex-wrap:wrap;gap:6px}
.reason .rv .chip{font-size:var(--fs-sm);padding:3px 10px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:var(--gap)}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ecard h2 button{all:unset;cursor:pointer}
.ecard h2 button:hover{text-decoration:underline;text-underline-offset:3px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) 64px 40px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.plist button{all:unset;cursor:pointer;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.plist button:hover{text-decoration:underline}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plist .n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--ink-3)}
.sibs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sibs .chip{min-height:34px;padding:3px 12px 3px 4px}
mark{background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:0 2px}

/* 히트맵 — 행: 상품·분류·파트너사, 열: 세분류. 색: 초록=칭찬 우세, 빨강=불만 우세, 노랑=갈림. 진할수록 이야기가 많음 */
.hm-wrap{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:4px;font-size:var(--fs-sm);width:auto}
.hm th{background:none;border:0;padding:4px 6px;color:var(--ink-2);font-weight:600;text-align:center;white-space:nowrap}
.hm th.rl{text-align:left;min-width:180px;max-width:240px}
.hm th.rl button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.hm th.rl button:hover{text-decoration:underline}
.hm td{width:62px;min-width:62px;height:40px;text-align:center;border-radius:7px;border:0;padding:0;font-variant-numeric:tabular-nums;font-weight:700;color:#fff;cursor:default}
.hm td.z{background:var(--sunken);color:var(--ink-3);font-weight:400}
.hm-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2);align-items:center}
.hm-legend span{display:inline-flex;gap:6px;align-items:center}

/* 비교 */
.cmpbtn{min-height:32px;padding:3px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap}
.cmpbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:calc(100vw - 32px)}
.cmpbar b{font-weight:700}
.cmpbar button{min-height:40px;padding:6px 16px;border-radius:10px;border:0;cursor:pointer;font-weight:700}
.cmpbar .go{background:var(--accent);color:var(--accent-ink)}
.cmpbar .clr{background:transparent;color:var(--bg);border:1px solid rgba(0,0,0,.25)}
.cgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:var(--gap);overflow-x:auto;padding-bottom:4px}
.ccol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ccol h2{display:flex;gap:10px;align-items:center}
.ccol h3{font-size:var(--fs-sm);color:var(--ink-3);margin:0;font-weight:500}
.mini{display:flex;flex-direction:column;gap:6px}
.mini div{display:grid;grid-template-columns:64px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:var(--fs-sm)}
.mini i{display:block;height:10px;border-radius:3px}

/* 가이드 */
.guide dl{margin:0;display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px 20px}
.guide dt{font-weight:700;font-size:17px}
.guide dd{margin:0;color:var(--ink-2);font-size:16.5px;line-height:1.6}
.guide ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px;font-size:16.5px;color:var(--ink-2)}

@media (max-width:960px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;gap:8px;padding:12px 16px 8px;border-right:0;border-bottom:1px solid var(--line)}
  .brand .sub,.menu-label,.rail-foot{display:none}
  .brand{padding:0} .brand .name{font-size:var(--fs-lg)}
  .navs{display:flex;overflow-x:auto;gap:2px;margin-inline:-16px;padding-inline:12px}
  .menu{flex-direction:row;gap:2px}
  .tab{white-space:nowrap;border-radius:0;min-height:44px;padding:8px 12px}
  .tab[aria-current="page"]{background:none;box-shadow:inset 0 -3px 0 var(--accent)}
  .periods{display:flex;overflow-x:auto;padding:0}
  .periods button{min-height:34px;padding:4px 12px;white-space:nowrap}
  main{padding-block:20px 110px}
  h1{font-size:25px} .fig .v{font-size:32px}
  .rank li{grid-template-columns:minmax(0,1fr) 80px 46px}
  .item{grid-template-columns:minmax(0,1fr);gap:4px}
  .hide-sm{display:none}
  th,td{padding:10px 8px}
  .reason{grid-template-columns:minmax(0,1fr);gap:6px}
  .ld-ex{margin-left:0}
  .guide dl{grid-template-columns:minmax(0,1fr);gap:4px}
  .guide dd{margin-bottom:10px}
  .phead .thumb{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{display:flex;flex-direction:column;gap:12px;width:min(300px,100%);text-align:center}
.gate .name{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700}

<div class="gate" id="gate" hidden><form id="gate-form" autocomplete="off"><div class="name">겸손몰 후기</div><label class="muted small" for="gate-input">비밀번호를 입력해 주세요</label><input id="gate-input" type="password" inputmode="text" required><button type="submit">들어가기</button><div class="msg" id="gate-msg" aria-live="polite"></div></form></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
// 입장 잠금(실제 사이트에서만).
const G = window.__GATE__;
if (G) {
  let passed = false; try { passed = sessionStorage.getItem('_nh_gate') === '1'; } catch (e) {}
  if (!passed) {
    const gate = document.getElementById('gate'), inp = document.getElementById('gate-input');
    gate.hidden = false; setTimeout(() => inp.focus(), 50);
    document.getElementById('gate-form').addEventListener('submit', e => {
      e.preventDefault();
      if (inp.value === G.g || inp.value === G.a) { try { sessionStorage.setItem('_nh_gate', '1'); } catch (e) {} gate.hidden = true; }
      else { inp.value = ''; inp.classList.add('err'); document.getElementById('gate-msg').textContent = '비밀번호가 맞지 않습니다. 다시 입력해 주세요.'; inp.focus(); }
    });
  }
}
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta, P = D.products;
const byKey = Object.fromEntries(P.map(p => [p.key, p]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const SENT = ['칭찬', '보통', '불만'], SK = ['g', 'n', 'b'];
const INT_LABEL = {'교환·반품':'교환·반품·AS', '문의':'문의', '제품제안':'제품 제안', '재구매희망':'다시 사고 싶음', '양도·거래':'구매자끼리 거래'};
const REASON_INTS = ['교환·반품', '문의', '제품제안', '재구매희망'];
const tagName = t => t.replace(/^#/, '');
const total = s => s[0] + s[1] + s[2];
const goodShare = p => pct(p.sent[0], total(p.sent));
const badShare = p => pct(p.sent[2], total(p.sent));
const topNeg = (p, k = 1) => Object.keys(p.neg || {}).slice(0, k);
const TAGS = M.tags, INTS = M.intents || [];
const mallLink = p => p.pid ? `https://nonohumble.com/product/detail.html?product_no=${p.pid}` : '';
const reviewLink = id => `https://nonohumble.com/article/%EC%83%81%ED%92%88-%EC%82%AC%EC%9A%A9%ED%9B%84%EA%B8%B0/4/${id}/`;
const EXT_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ext = href => href ? `<a class="ext" href="${esc(href)}" target="_blank" rel="noopener" aria-label="원문 보기" title="원문 보기">${EXT_SVG}</a>` : '';
const ymdStr = n => { const d = String(n); return `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`; };
const jo = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b; };

// ── 기간 ──
const PERIODS = [['30', '최근 30일'], ['90', '최근 90일'], ['365', '최근 1년'], ['all', '전체 기간']];
let period = 'all';
const minN = () => ({ '30': 3, '90': 8, '365': 20, all: 40 })[period];
const ANCHOR = (M.updated || '').slice(0, 10) || new Date().toISOString().slice(0, 10);
const ymdMinus = days => { const d = new Date(ANCHOR + 'T00:00:00'); d.setDate(d.getDate() - days); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const cutoff = () => period === 'all' ? 0 : ymdMinus(+period);
const periodLabel = () => PERIODS.find(x => x[0] === period)[1];
const sortObj = o => Object.fromEntries(Object.entries(o).sort((a, b) => b[1] - a[1]));
// 상품별 숫자를 고른 기간으로 다시 센다(D.R = 후기 축약 목록). it = 요청 종류 → 세분류 → 개수
function applyPeriod() {
  const c = cutoff(), acc = P.map(() => ({ n: 0, sent: [0, 0, 0], pos: {}, neg: {}, it: {}, itN: {} }));
  for (const r of D.R) {
    if (r[1] < c) continue;
    const a = acc[r[0]]; a.n++;
    for (const sg of r[5]) {
      a.sent[sg[0]]++;
      for (const ti of sg[1]) { const t = TAGS[ti]; if (sg[0] === 0) a.pos[t] = (a.pos[t] || 0) + 1; if (sg[0] === 2) a.neg[t] = (a.neg[t] || 0) + 1; }
      if (sg[2] >= 0) { const k = INTS[sg[2]]; a.itN[k] = (a.itN[k] || 0) + 1; const o = a.it[k] = a.it[k] || {}; for (const ti of sg[1]) o[TAGS[ti]] = (o[TAGS[ti]] || 0) + 1; }
    }
  }
  P.forEach((p, i) => { const a = acc[i]; Object.assign(p, { n: a.n, sent: a.sent, pos: sortObj(a.pos), neg: sortObj(a.neg), it: a.it, itN: a.itN }); });
}
const visible = p => p.n > 0;

// ── 주간 증감: 이번 주 = 기준일 포함 최근 7일, 지난주 = 그 전 7일(기간 선택과 무관) ──
const W0 = ymdMinus(6), W1 = ymdMinus(13);
const WK = P.map(() => ({ g: 0, b: 0, gp: 0, bp: 0, n: 0, np: 0 }));
for (const r of D.R) {
  if (r[1] < W1) continue;
  const w = WK[r[0]], cur = r[1] >= W0;
  cur ? w.n++ : w.np++;
  for (const sg of r[5]) { if (sg[0] === 0) cur ? w.g++ : w.gp++; if (sg[0] === 2) cur ? w.b++ : w.bp++; }
}
const PI = new Map(P.map((p, i) => [p, i]));
const wkOf = ps => ps.reduce((a, p) => { const w = WK[PI.get(p)]; for (const k in a) a[k] += w[k]; return a; }, { g: 0, b: 0, gp: 0, bp: 0, n: 0, np: 0 });
// 칭찬은 늘면 초록, 불만은 늘면 빨강
function delta(cur, prev, upIsGood = true) {
  const d = cur - prev;
  if (!d) return `<span class="dl flat" title="지난주와 같음">— 0</span>`;
  const good = (d > 0) === upIsGood, p = prev ? `${d > 0 ? '+' : ''}${Math.round(d / prev * 100)}%` : '새로';
  return `<span class="dl ${good ? 'good' : 'bad'}" title="지난주 ${prev} → 이번 주 ${cur}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)} <small style="font-weight:500">(${p})</small></span>`;
}
const wkLine = w => `<div class="wk"><span>칭찬 <b>${fmt(w.g)}</b> ${delta(w.g, w.gp, true)}</span><span>불만 <b>${fmt(w.b)}</b> ${delta(w.b, w.bp, false)}</span></div>`;

// ── 상태 색: 칭찬이 많으면 초록, 불만이 많으면 빨강, 진할수록 한쪽으로 쏠림 ──
function tone(s) {
  const t = s[0] + s[2]; if (!t) return 'var(--line-2)';
  const bal = (s[0] - s[2]) / t, k = Math.round(25 + 75 * Math.min(1, Math.abs(bal)));
  return `color-mix(in srgb, ${bal >= 0 ? 'var(--good)' : 'var(--bad)'} ${k}%, var(--line-2))`;
}
const thumb = (p, size = 44, s) => p.img
  ? `<img class="thumb" src="${esc(p.img)}" width="${size}" height="${size}" loading="lazy" referrerpolicy="no-referrer" alt="" style="border-color:${tone(s || p.sent)}" onerror="this.style.visibility='hidden'">`
  : `<span class="thumb ph" style="width:${size}px;height:${size}px;border-color:${tone(s || p.sent)}" aria-hidden="true"></span>`;
const numChip = p => `<span class="chip no">${p.pilot ? '파일럿' : esc(p.num)}</span>`;
const sbar = (s, h) => { const t = total(s) || 1; const a = `칭찬 ${pct(s[0], t)}%, 보통 ${pct(s[1], t)}%, 불만 ${pct(s[2], t)}%`;
  return `<div class="sbar" role="img" aria-label="${a}" title="${a}" ${h ? `style="height:${h}px"` : ''}>${s.map((v, i) => v ? `<i class="${SK[i]}" style="width:${v / t * 100}%"></i>` : '').join('')}</div>`; };
const keyRow = () => `<div class="key" aria-hidden="true">${SENT.map((s, i) => `<span><i class="dot ${SK[i]}"></i>${s}</span>`).join('')}</div>`;

// ── 묶음(상품 여러 개) 합치기 ──
function agg(ps) {
  const a = { n: 0, sent: [0, 0, 0], pos: {}, neg: {}, it: {}, itN: {}, ex: {} }, best = {};
  ps.forEach(p => {
    a.n += p.n; p.sent.forEach((v, i) => a.sent[i] += v);
    for (const [k, v] of Object.entries(p.pos)) a.pos[k] = (a.pos[k] || 0) + v;
    for (const [k, v] of Object.entries(p.neg)) a.neg[k] = (a.neg[k] || 0) + v;
    for (const [k, v] of Object.entries(p.itN)) a.itN[k] = (a.itN[k] || 0) + v;
    for (const [k, o] of Object.entries(p.it)) { const t = a.it[k] = a.it[k] || {}; for (const [x, v] of Object.entries(o)) t[x] = (t[x] || 0) + v; }
    Object.entries(p.tex || {}).forEach(([k, e]) => ['g', 'b'].forEach(s => { const v = (s === 'g' ? p.pos : p.neg)[k] || 0;
      if (e[s] && v > (best[k + s] || 0)) { best[k + s] = v; (a.ex[k] = a.ex[k] || {})[s] = ps.length > 1 ? e[s].map(x => ({ ...x, s: `${p.name} · ${x.s}` })) : e[s]; } }));
  });
  a.pos = sortObj(a.pos); a.neg = sortObj(a.neg); a.wk = wkOf(ps); a.ps = ps;
  return a;
}
const catGroups = () => { const m = {}; P.filter(visible).forEach(p => (p.cats.length ? p.cats : ['분류 없음']).forEach(c => (m[c] = m[c] || []).push(p))); return m; };
const partnerGroups = () => { const m = {}; P.filter(visible).forEach(p => p.partners.forEach(x => (m[x] = m[x] || []).push(p))); return m; };
const tagStats = (pos, neg) => [...new Set([...Object.keys(pos || {}), ...Object.keys(neg || {})])].map(k => ({ k, name: tagName(k), g: (pos || {})[k] || 0, b: (neg || {})[k] || 0 }));

// ── 인사이트(상품 상세에서만) ──
function insights(rows) {
  const out = [], G = rows.filter(r => r.g).sort((a, b) => b.g - a.g), B = rows.filter(r => r.b).sort((a, b) => b.b - a.b);
  const gT = G.reduce((a, r) => a + r.g, 0), bT = B.reduce((a, r) => a + r.b, 0);
  if (G.length) out.push(G[1] ? `칭찬은 «${G[0].name}»${jo(G[0].name, '과', '와')} «${G[1].name}» 이야기에 가장 많습니다. 둘을 합치면 칭찬의 ${pct(G[0].g + G[1].g, gT)}%입니다.` : `칭찬은 «${G[0].name}» 이야기에 가장 많습니다.`);
  if (B.length) { const sh = pct(B[0].b, bT); out.push(sh >= 35 ? `불만은 «${B[0].name}»에 몰려 있습니다. 불만의 ${sh}%가 이 이야기입니다.` : (B[1] ? `불만은 «${B[0].name}»(${B[0].b}개), «${B[1].name}»(${B[1].b}개) 등으로 흩어져 있습니다.` : `불만은 «${B[0].name}» 이야기에서 나옵니다.`)); }
  const split = rows.filter(r => r.g >= 5 && r.b >= 5 && r.b / (r.g + r.b) >= .35 && r.b / (r.g + r.b) <= .65).sort((a, b) => (b.g + b.b) - (a.g + a.b))[0];
  if (split) out.push(`«${split.name}»${jo(split.name, '은', '는')} 칭찬 ${split.g}개, 불만 ${split.b}개로 사람마다 평가가 갈립니다.`);
  const bad = rows.filter(r => r.b >= 5 && r.b / (r.g + r.b) > .65 && r !== B[0]).sort((a, b) => b.b - a.b)[0];
  if (bad) out.push(`«${bad.name}» 이야기가 나오면 ${pct(bad.b, bad.g + bad.b)}%가 불만입니다.`);
  const good = rows.filter(r => r.g >= 10 && r.g / (r.g + r.b) >= .9 && r !== G[0]).sort((a, b) => b.g - a.g)[0];
  if (good) out.push(`«${good.name}»${jo(good.name, '은', '는')} 거의 칭찬만 받습니다(칭찬 ${good.g}개, 불만 ${good.b}개).`);
  return out.length ? out : ['이 기간에는 세분류가 붙은 이야기가 적어서 정리할 만한 흐름이 없습니다.'];
}
const insightBox = rows => `<section class="insight" aria-labelledby="h-ins"><h2 id="h-ins">핵심 인사이트</h2><ul>${insights(rows).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
function likeDislike(rows, ex, n = 6) {
  const G = rows.filter(r => r.g).sort((a, b) => b.g - a.g).slice(0, n), B = rows.filter(r => r.b).sort((a, b) => b.b - a.b).slice(0, n);
  const max = Math.max(1, ...G.map(r => r.g), ...B.map(r => r.b));
  const list = (arr, k) => arr.length ? `<ul class="ld">${arr.map(r => { const e = ((ex || {})[r.k] || {})[k] || [];
    return `<li><div class="ld-top"><span class="ld-name">${esc(r.name)}</span><span class="ld-bar"><i class="${k}" style="width:${r[k] / max * 100}%"></i></span><span class="ld-n">${fmt(r[k])}</span></div>${e[0] ? `<span class="ld-ex">“${esc(e[0].s)}” ${ext(e[0].link)}</span>` : ''}</li>`; }).join('')}</ul>` : '<p class="muted">이 기간에는 없습니다.</p>';
  return `<div class="cols">
    <section class="panel" aria-labelledby="h-like"><div class="panel-head"><h2 id="h-like"><i class="dot g"></i> 마음에 든 점</h2><span class="small muted">세분류별 칭찬 개수</span></div>${list(G, 'g')}</section>
    <section class="panel" aria-labelledby="h-dislike"><div class="panel-head"><h2 id="h-dislike"><i class="dot b"></i> 마음에 안 든 점</h2><span class="small muted">세분류별 불만 개수</span></div>${list(B, 'b')}</section></div>`;
}
// 교환·문의·제안·재구매가 어떤 세분류 때문이었나
function reasons(a) {
  const rows = REASON_INTS.filter(k => a.itN[k]).map(k => {
    const tags = Object.entries(a.it[k] || {}).sort((x, y) => y[1] - x[1]).slice(0, 6);
    const cls = k === '교환·반품' ? 'bad' : k === '재구매희망' ? 'good' : '';
    return `<div class="reason"><div class="rk">${esc(INT_LABEL[k])} ${fmt(a.itN[k])}건<small>${k === '교환·반품' ? '무엇 때문에 바꾸거나 고쳐 달라고 했나' : k === '문의' ? '무엇을 물었나' : k === '제품제안' ? '무엇을 바꿔 달라고 했나' : '무엇이 좋아서 또 사고 싶다고 했나'}</small></div>
      <div class="rv">${tags.length ? tags.map(([t, v]) => `<span class="chip ${cls}">${esc(tagName(t))} ${fmt(v)}</span>`).join('') : '<span class="muted small">세분류 표시가 없는 이야기입니다</span>'}</div></div>`;
  });
  return `<section class="panel" aria-labelledby="h-rsn"><div class="panel-head"><div><h2 id="h-rsn">교환·문의·제안은 무엇 때문이었나</h2><p class="small muted">후기 속 요청을 세분류로 나눴습니다. 처리 현황이 아니라 «왜»를 보는 칸입니다.</p></div></div>
    ${rows.length ? `<div class="reasons">${rows.join('')}</div>` : '<p class="muted">이 기간에는 요청이 담긴 후기가 없습니다.</p>'}</section>`;
}

// ── 히트맵: 행 × 세분류. 셀 색 = 칭찬/불만 쏠림, 진하기 = 이야기 수 ──
function heatmap(rows, title, sub, cols = 9) {
  rows = rows.filter(r => r.a.n > 0);
  if (!rows.length) return '';
  const tot = {}; rows.forEach(r => tagStats(r.a.pos, r.a.neg).forEach(x => tot[x.k] = (tot[x.k] || 0) + x.g + x.b));
  const C = Object.keys(tot).sort((a, b) => tot[b] - tot[a]).slice(0, cols);
  const max = Math.max(1, ...rows.flatMap(r => C.map(c => (r.a.pos[c] || 0) + (r.a.neg[c] || 0))));
  const cell = (r, c) => { const g = r.a.pos[c] || 0, b = r.a.neg[c] || 0, t = g + b;
    if (!t) return `<td class="z" title="${esc(r.label)} · ${esc(tagName(c))}: 이야기 없음">·</td>`;
    const bal = (g - b) / t, base = bal >= .2 ? 'var(--good)' : bal <= -.2 ? 'var(--bad)' : 'var(--mixed)', k = Math.round(30 + 65 * Math.sqrt(t / max));
    return `<td style="background:color-mix(in srgb, ${base} ${k}%, var(--sunken))" title="${esc(r.label)} · ${esc(tagName(c))}: 칭찬 ${g} · 불만 ${b}">${t}</td>`; };
  return `<section class="panel" aria-labelledby="h-hm"><div class="panel-head"><div><h2 id="h-hm">${esc(title)}</h2><p class="small muted">${esc(sub)} 칸 숫자는 그 세분류 이야기 수, 칸에 마우스를 올리면 칭찬·불만이 나옵니다.</p></div></div>
    <div class="hm-legend"><span><i class="dot g"></i>칭찬이 많은 세분류</span><span><i class="dot b"></i>불만이 많은 세분류</span><span><i class="dot m"></i>비슷하게 갈림</span><span class="muted">진할수록 이야기가 많음</span></div>

const tip = $('#tip');

  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;

    <section class="panel"><div class="panel-head"><h2>불만 후기</h2><span class="small muted">전체 기간 대표</span></div><div class="quotes">${q(p.neg_q, 'b')}</div></section>

// ── 보기: 분류별 / 파트너사별 (같은 틀) ──
function groupCards(groups, type, attrName) {
  const order = Object.entries(groups).map(([k, ps]) => ({ k, ps, a: agg(ps) })).sort((x, y) => y.a.n - x.a.n);
  return { order, html: `<div class="pgrid">${order.map(({ k, ps, a }) => {
    const g = Object.keys(a.pos).slice(0, 2).map(tagName), b = Object.keys(a.neg).slice(0, 2).map(tagName);
    return `<section class="ecard" style="box-shadow:inset 4px 0 0 ${tone(a.sent)}"><div class="panel-head"><h2><button ${attrName}="${esc(k)}">${esc(k)}</button></h2>${cmpBtn(type, k)}</div>
      <div class="small muted">상품 ${ps.length}개 · 후기 ${fmt(a.n)}건</div>${wkLine(a.wk)}
      ${g.length ? `<div class="small"><span class="muted">마음에 든 점</span> ${g.map(x => `<span class="chip good">${esc(x)}</span>`).join(' ')}</div>` : ''}
      ${b.length ? `<div class="small"><span class="muted">마음에 안 든 점</span> ${b.map(x => `<span class="chip bad">${esc(x)}</span>`).join(' ')}</div>` : ''}
      <ul class="plist">${ps.sort((x, y) => y.n - x.n).slice(0, 5).map(p => `<li><button data-open="${esc(p.key)}">${thumb(p, 26)}<span class="nm">${esc(p.name)}</span></button>${sbar(p.sent, 8)}<span class="n">${fmt(p.n)}</span></li>`).join('')}</ul></section>`;
  }).join('')}</div>` };
}
function vCategories() {
  const { order, html } = groupCards(catGroups(), 'category', 'data-cat');
  return `<header class="head"><div class="eyebrow">${esc(periodLabel())} · 분류 ${order.length}개 · 카드 왼쪽 띠: 초록=칭찬이 많음, 빨강=불만이 많음</div><h1>분류별</h1></header>
  ${heatmap(order.map(o => ({ label: o.k, attr: `data-cat="${esc(o.k)}"`, a: o.a })), '분류 × 세분류 히트맵', '분류마다 어떤 세분류에서 칭찬·불만이 나왔는지 봅니다.')}${html}`;
}
function vPartners() {
  const { order, html } = groupCards(partnerGroups(), 'partner', 'data-partner');

  ${heatmap(order.map(o => ({ label: o.k, attr: `data-partner="${esc(o.k)}"`, a: o.a })), '파트너사 × 세분류 히트맵', '파트너사마다 어떤 세분류에서 칭찬·불만이 나왔는지 봅니다.')}${html}`;
}
function vGroupDetail(type, key) {
  const ps = ((type === 'category' ? catGroups() : partnerGroups())[key] || []).sort((x, y) => y.n - x.n);
  if (!ps.length) return `${backBtn(type === 'category' ? 'categories' : 'partners', '목록으로')}<div class="empty">이 기간에는 후기가 없습니다. 왼쪽에서 기간을 넓혀 보세요.</div>`;

// ── 보기: 후기 검색 ──
function vSearch() {
  return `<header class="head"><div class="eyebrow">${esc(periodLabel())} · 후기 ${fmt(D.R.length)}건의 제목·본문에서 찾기</div><h1>후기 검색</h1></header>
  <div class="tools" role="search">
    <label class="field">찾을 말<input id="s-q" type="search" placeholder="예: 보풀, 사이즈, 배송" value="${esc(st.sq)}"></label>
    <div class="seg" role="group" aria-label="감정으로 거르기">${[['', '모든 후기'], ['2', '불만이 있는 후기'], ['0', '칭찬이 있는 후기']].map(([v, l]) => `<button data-ss="${v}" aria-pressed="${st.ss === v}">${l}</button>`).join('')}</div>
  </div><section class="panel" aria-live="polite"><div id="slist"></div></section>`;
}
function renderSearch() {
  const el = $('#slist'); if (!el) return;
  const q = st.sq.trim(), ql = q.toLowerCase();
  if (q.length < 2) { el.innerHTML = '<div class="empty">두 글자 이상 넣어 주세요.</div>'; return; }
  const c = cutoff(), hits = [];
  for (const r of D.R) { if (r[1] < c) continue; const txt = r[2] + ' — ' + r[3], i = txt.toLowerCase().indexOf(ql); if (i < 0) continue; if (st.ss && !r[5].some(sg => String(sg[0]) === st.ss)) continue; hits.push([r, i, txt]); }
  hits.sort((a, b) => b[0][1] - a[0][1]);
  const snip = (t, i) => { const a = Math.max(0, i - 50), b = Math.min(t.length, i + q.length + 90); return (a ? '…' : '') + esc(t.slice(a, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, b)) + (b < t.length ? '…' : ''); };
  el.innerHTML = hits.length ? `<p class="small muted" style="margin:0">«${esc(q)}» ${fmt(hits.length)}건</p><div class="list">${hits.slice(0, st.sShow).map(([r, i, t]) => { const p = P[r[0]], ss = new Set(r[5].map(sg => sg[0]));
    return `<div class="item"><span class="when">${esc(ymdStr(r[1]))}</span><div class="what"><div class="meta"><button class="chip" data-open="${esc(p.key)}">${thumb(p, 18)} ${esc(p.name)}</button>${ss.has(2) ? '<span class="chip bad">불만 있음</span>' : ''}${ss.has(0) ? '<span class="chip good">칭찬 있음</span>' : ''}</div><span class="sum"><span>${snip(t, i)}</span>${ext(reviewLink(r[4]))}</span></div></div>`; }).join('')}</div>${hits.length > st.sShow ? `<button class="more" id="s-more">${fmt(Math.min(30, hits.length - st.sShow))}건 더 보기</button>` : ''}`
    : `<div class="empty">«${esc(q)}»이(가) 들어간 후기가 없습니다. 다른 말로 찾거나 기간을 «전체 기간»으로 바꿔 보세요.</div>`;
}

// ── 보기: 확인 대기 ──

// ── 라우팅 ──
const VIEWS = { overview: vOverview, products: vProducts, categories: vCategories, partners: vPartners, search: vSearch, queue: vQueue, guide: vGuide, compare: vCompare };
const NAV_OF = { product: 'products', category: 'categories', partner: 'partners' };
let current = 'overview', openKey = null;
function go(view, key = null, scroll = true) {
  current = view; openKey = key; hideTip();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.view === (NAV_OF[view] || view) ? 'page' : 'false'));
  $('#view').innerHTML = view === 'product' ? vProduct(key) : view === 'category' ? vGroupDetail('category', key) : view === 'partner' ? vGroupDetail('partner', key) : VIEWS[view]();
  if (view === 'products') renderPTable();
  if (view === 'search') { renderSearch(); const q = $('#s-q'); if (q && st.sq) { q.focus(); q.selectionStart = q.selectionEnd = q.value.length; } }
  try { history.replaceState(null, '', '#' + (NAV_OF[view] || view)); } catch (e) {}
  renderCmpBar();
  if (scroll) { scrollTo({ top: 0 }); $('#main').focus({ preventScroll: true }); }
}
function renderPeriods() { $('#periods').innerHTML = PERIODS.map(([v, l]) => `<button data-period="${v}" aria-pressed="${period === v}">${l}</button>`).join(''); }
function refreshBadges() { $('#b-products').textContent = P.filter(p => visible(p) && !p.pilot).length; }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-go],[data-open],[data-cat],[data-partner],[data-period],[data-cmp-type],[data-cmp-clear],[data-ss],#s-more');
  if (!t) return;
  if (t.dataset.cmpType) { e.stopPropagation(); toggleCmp(t.dataset.cmpType, t.dataset.cmpKey);
    if (current === 'compare') return go('compare', null, false);
    document.querySelectorAll(`[data-cmp-type]`).forEach(b => { const on = inCmp(b.dataset.cmpType, b.dataset.cmpKey); b.setAttribute('aria-pressed', on); if (!b.closest('.ccol')) b.textContent = on ? '✓ 비교에 담음' : '+ 비교'; });
    return renderCmpBar(); }
  if (t.dataset.cmpClear !== undefined) { cmp = { type: null, keys: [] }; return go(current, openKey, false); }
  if (t.dataset.period) { period = t.dataset.period; applyPeriod(); renderPeriods(); refreshBadges(); return go(current, openKey, false); }
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.open) return go('product', t.dataset.open);
  if (t.dataset.cat) return go('category', t.dataset.cat);
  if (t.dataset.partner) return go('partner', t.dataset.partner);
  if (t.dataset.ss !== undefined) { st.ss = t.dataset.ss; st.sShow = 30; document.querySelectorAll('[data-ss]').forEach(b => b.setAttribute('aria-pressed', b === t)); return renderSearch(); }
  if (t.id === 's-more') { st.sShow += 30; return renderSearch(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-open]')) { e.preventDefault(); go('product', e.target.dataset.open); } });
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') { st.q = e.target.value; renderPTable(); }
  if (e.target.id === 's-q') { st.sq = e.target.value; st.sShow = 30; clearTimeout(window.__sqT); window.__sqT = setTimeout(renderSearch, 200); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'f-cat') { st.cat = e.target.value; renderPTable(); }
  if (id === 'f-sort') { st.sort = e.target.value; renderPTable(); }
  if (id === 'f-pilot') { st.pilot = e.target.value === '1'; renderPTable(); }
});

applyPeriod(); renderPeriods(); refreshBadges();
$('#brand-sub').textContent = `후기 ${fmt(M.reviews)}건 · ${ANCHOR} 기준`;
if (M.queue) { $('#t-queue').hidden = false; $('#b-queue').textContent = fmt(M.queue); }
$('#rail-foot').innerHTML = `매일 08:00 겸손몰 게시판에서 새 후기를 모아 AI가 분류합니다.<br>테스트·추가구매 상품 ${fmt(M.excluded)}건은 뺐습니다.<br>${esc(M.built)} 갱신`;
// 들어오면 언제나 Overview부터(이석원 2026-10-13).
go('overview');
})();
</script>
