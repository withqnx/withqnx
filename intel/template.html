<title>겸손몰 후기 인텔리전스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 목차 + 오른쪽 한 줄 본문. 위에서 아래로 «요약 → 먼저 볼 것 → 근거» 순서. 청자(靑瓷)빛 강조 한 가지. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunken:#eef2f0;
  --ink:#15201c; --ink-2:#3f4c48; --ink-3:#5d6a66; --line:#d9e0dd; --line-2:#c5cfcb;
  --accent:#1d6b5c; --accent-ink:#ffffff; --accent-soft:#e1efea;
  --good:#2a78d6; --neutral:#a3aba8; --bad:#d8413f;
  --good-soft:#e3eefb; --bad-soft:#fbe7e6;
  --heat-0:#f3f5f4; --heat-1:#f7d5d2; --heat-2:#eea39d; --heat-3:#e0675f; --heat-4:#b83430;
  --font-display:'Gowun Batang','Nanum Myeongjo',AppleMyungjo,ui-serif,Georgia,serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --fs-xs:12.5px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:30px; --fs-3xl:40px;
  --r:10px; --gap:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --surface:#171c1b; --sunken:#1d2321;
  --ink:#eef3f1; --ink-2:#bdc7c3; --ink-3:#95a19c; --line:#2a3331; --line-2:#3a4542;
  --accent:#62c4ad; --accent-ink:#0b1210; --accent-soft:#1a2e29;
  --good:#3f8de8; --neutral:#65706c; --bad:#e86a67;
  --good-soft:#18263a; --bad-soft:#3a1d1c;
  --heat-0:#1b2120; --heat-1:#4a2523; --heat-2:#7a302d; --heat-3:#b3403b; --heat-4:#e8736e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --surface:#171c1b; --sunken:#1d2321;
  --ink:#eef3f1; --ink-2:#bdc7c3; --ink-3:#95a19c; --line:#2a3331; --line-2:#3a4542;
  --accent:#62c4ad; --accent-ink:#0b1210; --accent-soft:#1a2e29;
  --good:#3f8de8; --neutral:#65706c; --bad:#e86a67;
  --good-soft:#18263a; --bad-soft:#3a1d1c;
  --heat-0:#1b2120; --heat-1:#4a2523; --heat-2:#7a302d; --heat-3:#b3403b; --heat-4:#e8736e;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.65;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:3px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-right:1px solid var(--line);
  background:var(--surface);padding:28px 14px 24px;display:flex;flex-direction:column;gap:22px}
.brand{padding:0 10px}
.brand .name{font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;line-height:1.25;letter-spacing:-.01em}
.brand .sub{color:var(--ink-3);font-size:var(--fs-xs);margin-top:4px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu-label{font-size:var(--fs-xs);color:var(--ink-3);padding:0 10px 6px;letter-spacing:.04em}
.tab{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:8px 12px;border:0;border-radius:8px;
  background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-size:var(--fs-md)}
.tab:hover{background:var(--sunken);color:var(--ink)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.tab .badge{font-size:var(--fs-xs);font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sunken);color:var(--ink-2)}
.tab .badge.warn{background:var(--bad-soft);color:var(--ink)}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:var(--fs-xs);color:var(--ink-3);line-height:1.6}

main{min-width:0;padding-inline:clamp(16px,4vw,48px);padding-block:32px 72px}
.wrap{max-width:1120px;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:var(--fs-sm);color:var(--ink-3)}
h1{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;line-height:1.3;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:var(--fs-lg);font-weight:600;margin:0;line-height:1.4;text-wrap:balance}
h3{font-size:var(--fs-md);font-weight:600;margin:0}
.lead{font-size:var(--fs-lg);color:var(--ink-2);max-width:62ch;margin:0}
.muted{color:var(--ink-3)}
.small{font-size:var(--fs-sm)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel-head p{margin:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}

.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.fig .k{font-size:var(--fs-sm);color:var(--ink-2)}
.fig .v{font-family:var(--font-display);font-size:var(--fs-3xl);line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.fig .v small{font-family:var(--font-body);font-size:var(--fs-md);font-weight:500;color:var(--ink-2);margin-left:3px}
.fig .d{font-size:var(--fs-xs);color:var(--ink-3)}
.fig.alert{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

.compass{display:flex;gap:12px;align-items:flex-start;background:var(--sunken);border-radius:var(--r);padding:14px 18px;color:var(--ink-2);font-size:var(--fs-sm)}
.compass b{color:var(--ink)}
.compass svg{flex:0 0 22px;margin-top:2px}

/* 반응 막대 */
.sbar{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden;min-width:80px;background:var(--sunken)}
.sbar i{display:block;height:100%}
.sbar i.g{background:var(--good)} .sbar i.n{background:var(--neutral)} .sbar i.b{background:var(--bad)}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 10px}
.dot.g{background:var(--good)} .dot.n{background:var(--neutral)} .dot.b{background:var(--bad)}

.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) 150px 58px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pname{display:flex;flex-direction:column;min-width:0}
.rank .pname button{all:unset;cursor:pointer;font-weight:600;color:var(--ink)}
.rank .pname button:hover{text-decoration:underline;text-underline-offset:3px}
.rank .pname button:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.rank .why{font-size:var(--fs-sm);color:var(--ink-3)}
.rank .pct{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:2px 9px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.chip.no{font-family:var(--font-body);font-weight:600;background:var(--sunken);border-color:transparent;color:var(--ink-2)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--ink)}

/* 막대 목록 */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:72px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:var(--fs-sm)}
.hbar .track{height:14px;background:var(--sunken);border-radius:4px;position:relative;overflow:hidden}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hbar .track i.all{background:var(--line-2)}
.hbar .track i.neg{background:var(--bad)}
.hbar .v{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 차트 */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:560px}
.chart text{fill:var(--ink-3);font-size:12px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:8px;font-size:var(--fs-sm);
  line-height:1.5;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}

/* 도구 줄 */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);color:var(--ink-3)}
.field input,.field select{min-height:40px;padding:8px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:var(--fs-md);color:var(--ink);min-width:0}
.field input{width:min(280px,100%)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button .c{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}

/* 표 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}
th{font-weight:600;color:var(--ink-2);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunken)}
tbody tr:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pcell{display:flex;align-items:center;gap:9px;min-width:0}
.pcell b{font-weight:600;font-size:var(--fs-md);color:var(--ink)}

/* 목록(요청·확인) */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;padding:14px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .when{font-size:var(--fs-sm);color:var(--ink-3);font-variant-numeric:tabular-nums}
.item .what{display:flex;flex-direction:column;gap:5px;min-width:0}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item .sum{font-size:var(--fs-md);color:var(--ink)}
.item .src{font-size:var(--fs-sm);color:var(--ink-3)}
.more{align-self:center;min-height:42px;padding:8px 22px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink)}
.more:hover{background:var(--sunken)}
.verdict{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:var(--fs-sm);color:var(--ink-2)}
.verdict .arrow{color:var(--ink-3)}

/* 제품 상세 */
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px 6px 10px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2);font-size:var(--fs-sm)}
.back:hover{background:var(--sunken);color:var(--ink)}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.quotes{display:flex;flex-direction:column;gap:12px}
.quote{border-left:3px solid var(--line-2);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:3px}
.quote.g{border-left-color:var(--good)} .quote.b{border-left-color:var(--bad)}
.quote .s{font-weight:600}
.quote .c{color:var(--ink-2);font-size:var(--fs-sm)}
.quote .m{font-size:var(--fs-xs);color:var(--ink-3)}

/* 불만 지도 */
.heat{border-collapse:separate;border-spacing:3px;font-size:var(--fs-xs)}
.heat th{position:static;background:none;border:0;padding:4px 6px;color:var(--ink-2);font-weight:500}
.heat th.p{text-align:right;white-space:nowrap;font-size:var(--fs-sm)}
.heat td{width:44px;min-width:44px;height:34px;text-align:center;border-radius:5px;border:0;padding:0;font-variant-numeric:tabular-nums;font-weight:600;cursor:default}
.heat td.h0{background:var(--heat-0);color:var(--ink-3);font-weight:400}
.heat td.h1{background:var(--heat-1);color:var(--ink)} .heat td.h2{background:var(--heat-2);color:var(--ink)}
.heat td.h3{background:var(--heat-3);color:#fff} .heat td.h4{background:var(--heat-4);color:#fff}
.legend-heat{display:flex;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--ink-3)}
.legend-heat i{width:22px;height:12px;border-radius:3px;display:inline-block}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) 110px 44px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.plist button{all:unset;cursor:pointer;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist button:hover{text-decoration:underline}
.plist button:focus-visible{outline:3px solid var(--accent);border-radius:3px}
.plist .n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
.empty{padding:28px 8px;text-align:center;color:var(--ink-3)}
.thumb{border-radius:8px;object-fit:cover;background:var(--sunken);flex:0 0 auto;vertical-align:middle;border:1px solid var(--line)}
.thumb.ph{display:inline-block}
.pc-txt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.rank .pname button,.plist button{display:inline-flex;align-items:center;gap:8px}
.phead{display:flex;gap:18px;align-items:center}
.phead .thumb{border-radius:14px}
.insight{background:var(--accent-soft);border-radius:var(--r);padding:18px 22px;display:flex;flex-direction:column;gap:8px}
.insight h2{font-size:var(--fs-md);color:var(--ink-2)}
.insight ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-lg);line-height:1.55}
.ld{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ld-top{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:var(--fs-sm)}
.ld-name{font-weight:600;font-size:var(--fs-md)}
.ld-bar{height:12px;background:var(--sunken);border-radius:4px;overflow:hidden;display:block}
.ld-bar i{display:block;height:100%;border-radius:0 4px 4px 0}
.ld-bar i.g{background:var(--good)} .ld-bar i.b{background:var(--bad)}
.ld-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ld-ex{display:block;margin:3px 0 0 86px;font-size:var(--fs-sm);color:var(--ink-3);text-decoration:none}
.ld-ex:hover{color:var(--accent);text-decoration:underline}
.pgrid .plist li{grid-template-columns:minmax(0,1fr) 64px 40px}
.plist button{min-width:0;max-width:100%}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.linkbtn{all:unset;cursor:pointer;color:var(--ink)}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.linkbtn:focus-visible{outline:3px solid var(--accent);border-radius:4px}
h2 .dot{vertical-align:1px}
@media (max-width:620px){.ld-ex{margin-left:0}.phead .thumb{width:64px;height:64px}}

@media (max-width:960px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:column;gap:10px;padding:12px 16px 0;border-right:0;border-bottom:1px solid var(--line)}
  .brand .sub,.menu-label,.rail-foot{display:none}
  .brand{padding:0}
  .brand .name{font-size:var(--fs-lg)}
  .navs{display:flex;overflow-x:auto;gap:2px;margin-inline:-16px;padding-inline:12px}
  .menu{flex-direction:row;gap:2px}
  .tab{white-space:nowrap;border-radius:0;min-height:44px;padding:8px 12px}
  .tab[aria-current="page"]{background:none;box-shadow:inset 0 -3px 0 var(--accent)}
  main{padding-block:22px 60px}
  h1{font-size:25px}
  .fig .v{font-size:32px}
  .rank li{grid-template-columns:minmax(0,1fr) 90px 48px}
  .item{grid-template-columns:minmax(0,1fr);gap:4px}
  .hide-sm{display:none}
  th,td{padding:10px 10px}
  td{overflow-wrap:normal}
  td.r{white-space:nowrap}
  .pcell .chip.no{display:none}
  .pcell b{min-width:6.5em;font-size:var(--fs-sm)}
  td .sbar{min-width:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{display:flex;flex-direction:column;gap:12px;width:min(300px,100%);text-align:center}
.gate .name{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700}
.gate input{min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:var(--fs-lg);text-align:center}
.gate input.err{border-color:var(--bad)}
.gate button{min-height:46px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:var(--fs-md);cursor:pointer}
.gate .msg{min-height:1.4em;font-size:var(--fs-sm);color:var(--ink-2)}
</style>

<div class="shell">
  <aside class="rail" aria-label="보기 선택">
    <div class="brand"><div class="name">겸손몰 후기</div><div class="sub" id="brand-sub"></div></div>
    <div class="navs">
      <nav class="menu" aria-label="분석">
        <div class="menu-label">분석</div>
        <button class="tab" data-view="overview">한눈에</button>
        <button class="tab" data-view="products">제품별<span class="badge" id="b-products"></span></button>
        <button class="tab" data-view="issues">불만 지도</button>
        <button class="tab" data-view="categories">분류별</button>
        <button class="tab" data-view="partners">파트너사별</button>
      </nav>
      <nav class="menu" aria-label="할 일">
        <div class="menu-label">할 일</div>
        <button class="tab" data-view="requests">고객 요청<span class="badge" id="b-requests"></span></button>
        <button class="tab" data-view="queue">확인 대기<span class="badge warn" id="b-queue"></span></button>
      </nav>

    </div>
    <div class="rail-foot" id="rail-foot"></div>
  </aside>
  <main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<div class="gate" id="gate" hidden><form id="gate-form" autocomplete="off"><div class="name">겸손몰 후기</div><label class="muted small" for="gate-input">비밀번호를 입력해 주세요</label><input id="gate-input" type="password" inputmode="text" required><button type="submit">들어가기</button><div class="msg" id="gate-msg" aria-live="polite"></div></form></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
// 입장 잠금(실제 사이트에서만). 관리자 화면(admin.html)과 같은 비밀번호·같은 통과 표시를 쓴다.
const G = window.__GATE__;
if (G) {
  let passed = false; try { passed = sessionStorage.getItem('_nh_gate') === '1'; } catch (e) {}
  if (!passed) {
    const gate = document.getElementById('gate'), inp = document.getElementById('gate-input');
    gate.hidden = false; setTimeout(() => inp.focus(), 50);
    document.getElementById('gate-form').addEventListener('submit', e => {
      e.preventDefault();
      if (inp.value === G.g || inp.value === G.a) {
        try { sessionStorage.setItem('_nh_gate', '1'); if (inp.value === G.a) sessionStorage.setItem('_nh_admin', '1'); else sessionStorage.removeItem('_nh_admin'); } catch (e) {}
        gate.hidden = true;
      } else { inp.value = ''; inp.classList.add('err'); document.getElementById('gate-msg').textContent = '비밀번호가 맞지 않습니다. 다시 입력해 주세요.'; inp.focus(); }
    });
  }
}
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta, P = D.products;
const byKey = Object.fromEntries(P.map(p => [p.key, p]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const SENT = ['좋음', '보통', '나쁨'], SK = ['g', 'n', 'b'];
const INT_LABEL = {'교환·반품':'교환·반품·AS', '문의':'문의', '제품제안':'제품 제안', '재구매희망':'다시 사고 싶음', '양도·거래':'구매자끼리 거래'};
const tagName = t => t.replace(/^#/, '');
const total = p => p.sent[0] + p.sent[1] + p.sent[2];
const badShare = p => pct(p.sent[2], total(p));
const goodShare = p => pct(p.sent[0], total(p));
const topNeg = (p, k = 1) => Object.keys(p.neg || {}).slice(0, k);
const MIN_N = 40;   // 비율로 줄 세울 때 최소 후기 수
const mallLink = p => p.pid ? `https://nonohumble.com/product/detail.html?product_no=${p.pid}` : '';
const label = p => p.pilot ? p.name : p.name;
const numChip = p => `<span class="chip no">${p.pilot ? '파일럿' : esc(p.num)}</span>`;
const thumb = (p, size = 44) => p.img ? `<img class="thumb" src="${esc(p.img)}" width="${size}" height="${size}" loading="lazy" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility='hidden'">` : `<span class="thumb ph" style="width:${size}px;height:${size}px" aria-hidden="true"></span>`;
// 세분류(태그)별 칭찬·불만
function tagStats(pos, neg) {
  return [...new Set([...Object.keys(pos || {}), ...Object.keys(neg || {})])].map(k => ({ k, name: tagName(k), g: (pos || {})[k] || 0, b: (neg || {})[k] || 0 }));
}
const jo = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b; };
function insights(rows) {
  const out = [];
  const G = rows.filter(r => r.g).sort((a, b) => b.g - a.g), B = rows.filter(r => r.b).sort((a, b) => b.b - a.b);
  const gT = G.reduce((a, r) => a + r.g, 0), bT = B.reduce((a, r) => a + r.b, 0);
  if (G.length) out.push(G[1] ? `칭찬은 «${G[0].name}»${jo(G[0].name, '과', '와')} «${G[1].name}» 이야기에 가장 많습니다. 둘을 합치면 칭찬의 ${pct(G[0].g + G[1].g, gT)}%입니다.` : `칭찬은 «${G[0].name}» 이야기에 가장 많습니다.`);
  if (B.length) { const sh = pct(B[0].b, bT);
    out.push(sh >= 35 ? `불만은 «${B[0].name}»에 몰려 있습니다. 불만의 ${sh}%가 이 이야기입니다.` : (B[1] ? `불만은 «${B[0].name}»(${B[0].b}개), «${B[1].name}»(${B[1].b}개) 등으로 흩어져 있습니다.` : `불만은 «${B[0].name}» 이야기에서 나옵니다.`)); }
  const split = rows.filter(r => r.g >= 5 && r.b >= 5 && r.b / (r.g + r.b) >= .35 && r.b / (r.g + r.b) <= .65).sort((a, b) => (b.g + b.b) - (a.g + a.b))[0];
  if (split) out.push(`«${split.name}»${jo(split.name, '은', '는')} 칭찬 ${split.g}개, 불만 ${split.b}개로 사람마다 평가가 갈립니다.`);
  const bad = rows.filter(r => r.b >= 5 && r.b / (r.g + r.b) > .65 && r !== B[0]).sort((a, b) => b.b - a.b)[0];
  if (bad) out.push(`«${bad.name}» 이야기가 나오면 ${pct(bad.b, bad.g + bad.b)}%가 불만입니다.`);
  const good = rows.filter(r => r.g >= 10 && r.g / (r.g + r.b) >= .9 && r !== G[0]).sort((a, b) => b.g - a.g)[0];
  if (good) out.push(`«${good.name}»${jo(good.name, '은', '는')} 거의 칭찬만 받습니다(칭찬 ${good.g}개, 불만 ${good.b}개).`);
  return out.length ? out : ['세분류가 붙은 이야기가 아직 적어서 정리할 만한 흐름이 없습니다.'];
}
function likeDislike(rows, ex, n = 6) {
  const G = rows.filter(r => r.g).sort((a, b) => b.g - a.g).slice(0, n), B = rows.filter(r => r.b).sort((a, b) => b.b - a.b).slice(0, n);
  const max = Math.max(1, ...G.map(r => r.g), ...B.map(r => r.b));
  const list = (arr, k, cls) => arr.length ? `<ul class="ld">${arr.map(r => { const e = ((ex || {})[r.k] || {})[k] || [];
    return `<li><div class="ld-top"><span class="ld-name">${esc(r.name)}</span><span class="ld-bar"><i class="${cls}" style="width:${r[k] / max * 100}%"></i></span><span class="ld-n">${fmt(r[k])}</span></div>${e[0] ? `<a class="ld-ex" href="${esc(e[0].link)}" target="_blank" rel="noopener">“${esc(e[0].s)}”</a>` : ''}</li>`; }).join('')}</ul>` : '<p class="muted">아직 없습니다.</p>';
  return `<div class="cols">
    <section class="panel" aria-labelledby="h-like"><div class="panel-head"><h2 id="h-like"><i class="dot g"></i> 마음에 든 점</h2><span class="small muted">세분류별 칭찬 개수</span></div>${list(G, 'g', 'g')}</section>
    <section class="panel" aria-labelledby="h-dislike"><div class="panel-head"><h2 id="h-dislike"><i class="dot b"></i> 마음에 안 든 점</h2><span class="small muted">세분류별 불만 개수</span></div>${list(B, 'b', 'b')}</section></div>`;
}
const insightBox = rows => `<section class="insight" aria-labelledby="h-ins"><h2 id="h-ins">한눈에 보는 인사이트</h2><ul>${insights(rows).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`;

const sbar = (s, h) => {
  const t = s[0] + s[1] + s[2] || 1;
  const a = `좋음 ${pct(s[0], t)}%, 보통 ${pct(s[1], t)}%, 나쁨 ${pct(s[2], t)}%`;
  return `<div class="sbar" role="img" aria-label="${a}" title="${a}" ${h ? `style="height:${h}px"` : ''}>${s.map((v, i) => v ? `<i class="${SK[i]}" style="width:${v / t * 100}%"></i>` : '').join('')}</div>`;
};
const keyRow = () => `<div class="key" aria-hidden="true">${SENT.map((s, i) => `<span><i class="dot ${SK[i]}"></i>${s}</span>`).join('')}</div>`;
const compass = () => `<div class="compass" role="note"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 8.5 13.3 13.3 8.5 15.5 10.7 10.7Z" fill="currentColor"/></svg><div><b>후기는 나침반이지 자가 아닙니다.</b> 후기는 쓰고 싶은 사람만 쓰기 때문에 %의 절대 크기는 믿기 어렵습니다. 제품끼리 비교하거나 달마다 흐름을 볼 때 쓰세요.</div></div>`;

// ── 툴팁 ──
const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect(); let L = x + 14, T = y + 14;
  if (L + r.width > innerWidth - 8) L = x - r.width - 14; if (T + r.height > innerHeight - 8) T = y - r.height - 14;
  tip.style.left = L + 'px'; tip.style.top = T + 'px'; }
const hideTip = () => tip.classList.remove('on');

// ── 월별 막대(쌓기) ──
function monthChart(rows, opt = {}) {
  const data = rows.slice(-(opt.last || 24));
  if (!data.length) return '<p class="muted">기록이 없습니다.</p>';
  const W = 760, H = 230, L = 40, R = 8, T = 12, B = 34;
  const tot = data.map(r => r[2] + r[3] + r[4]);
  const max = Math.max(...tot, 1);
  const step = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => max / s <= 5) || 1000;
  const top = Math.ceil(max / step) * step;
  const bw = (W - L - R) / data.length, bar = Math.max(4, Math.min(28, bw - 4));
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  const every = Math.ceil(data.length / 12);
  data.forEach((r, i) => {
    const x = L + i * bw + (bw - bar) / 2; let base = 0;
    const segs = [[r[2], 'var(--good)'], [r[3], 'var(--neutral)'], [r[4], 'var(--bad)']];
    const parts = segs.map(([v, c], k) => {
      if (!v) return '';
      const y1 = y(base + v), h = y(base) - y1 - (base ? 2 : 0); base += v;
      const isTop = segs.slice(k + 1).every(s => !s[0]);
      return isTop ? `<path d="M${x},${y1 + h} v${-(h - 3)} q0,-3 3,-3 h${bar - 6} q3,0 3,3 v${h - 3} z" fill="${c}"/>` : `<rect x="${x}" y="${y1}" width="${bar}" height="${Math.max(h, 0)}" fill="${c}"/>`;
    }).join('');
    const [yy, mm] = r[0].split('-');
    const lbl = (i % every === 0) ? `<text x="${x + bar / 2}" y="${H - B + 17}" text-anchor="middle">${(i === 0 || mm === '01' || (i >= every && data[i - every][0].slice(0, 4) !== yy)) ? yy.slice(2) + '년 ' : ''}${+mm}월</text>` : '';
    g += `<g class="mbar" data-i="${i}">${parts}<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/></g>${lbl}`;
  });
  const id = 'c' + Math.random().toString(36).slice(2, 7);
  setTimeout(() => {
    const svg = document.getElementById(id); if (!svg) return;
    svg.querySelectorAll('.mbar').forEach(el => {
      const r = data[+el.dataset.i], t = r[2] + r[3] + r[4];
      const html = `<b>${r[0].replace('-', '년 ')}월</b><br>후기 ${fmt(r[1])}건 · 언급 ${fmt(t)}개<br>좋음 ${fmt(r[2])} · 보통 ${fmt(r[3])} · 나쁨 ${fmt(r[4])} (${pct(r[4], t)}%)`;
      el.addEventListener('mousemove', e => showTip(html, e.clientX, e.clientY));
      el.addEventListener('mouseleave', hideTip);
    });
  });
  const summary = data.map(r => `${r[0]} 좋음 ${r[2]} 보통 ${r[3]} 나쁨 ${r[4]}`).join(', ');
  return `<div class="chart"><svg id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 언급 수. ${esc(summary)}">${g}</svg></div>`;
}

function hbars(rows, max) {
  return `<div class="hbars">${rows.map(r => `<div class="hbar"><span>${esc(r.name)}</span><div class="track" role="img" aria-label="${esc(r.name)}: 전체 ${r.all}개 중 나쁨 ${r.neg}개"><i class="all" style="width:${r.all / max * 100}%"></i><i class="neg" style="width:${r.neg / max * 100}%"></i></div><span class="v">나쁨 ${fmt(r.neg)}<span class="muted"> / ${fmt(r.all)}</span></span></div>`).join('')}</div>`;
}

// ── 보기: 한눈에 ──
function vOverview() {
  const t = M.monthly.reduce((a, r) => [a[0] + r[2], a[1] + r[3], a[2] + r[4]], [0, 0, 0]);
  const T = t[0] + t[1] + t[2];
  const last = M.monthly[M.monthly.length - 1] || ['', 0];
  const big = P.filter(p => p.n >= MIN_N && !p.pilot);
  const worst = [...big].sort((a, b) => badShare(b) - badShare(a)).slice(0, 6);
  const best = [...big].sort((a, b) => goodShare(b) - goodShare(a)).slice(0, 6);
  const tags = M.tags.map(k => ({ name: tagName(k), all: M.tag_all[k] || 0, neg: M.tag_neg[k] || 0 })).sort((a, b) => b.neg - a.neg).slice(0, 8);
  const tmax = Math.max(...tags.map(x => x.all));
  const topBad = worst[0];
  const rankRow = (p, v, why) => `<li><div class="pname"><button data-open="${esc(p.key)}">${thumb(p, 28)} ${esc(label(p))}</button><span class="why">${why}</span></div>${sbar(p.sent)}<span class="pct">${v}%</span></li>`;
  return `
  <header class="head"><div class="eyebrow">${esc(M.updated?.slice(0, 10))} 아침 기준 · 매일 08:00 새로 모읍니다</div>
    <h1>후기 속 이야기의 ${pct(t[2], T)}%가 불만입니다</h1>
    <p class="lead">가장 먼저 볼 제품은 <b>${esc(topBad.name)}</b>입니다. 이야기의 ${badShare(topBad)}%가 불만이고, 가장 많이 나온 불만은 «${esc(tagName(topNeg(topBad)[0] || ''))}»입니다.</p></header>
  <section class="figures" aria-label="주요 숫자">
    <div class="fig"><span class="k">분석한 후기</span><span class="v">${fmt(M.reviews)}<small>건</small></span><span class="d">한 후기 안의 칭찬·불만을 나눠 이야기 ${fmt(T)}개로 셉니다</span></div>
    <div class="fig"><span class="k">좋았다는 이야기</span><span class="v">${pct(t[0], T)}<small>%</small></span><span class="d">보통 ${pct(t[1], T)}% · 나쁨 ${pct(t[2], T)}%</span></div>
    <div class="fig"><span class="k">${+last[0].slice(5)}월에 새로 들어온 후기</span><span class="v">${fmt(last[1])}<small>건</small></span><span class="d">${esc(last[0].replace('-', '년 '))}월 1일부터</span></div>
    <div class="fig alert"><span class="k">사람이 확인할 후기</span><span class="v">${fmt(M.queue)}<small>건</small></span><span class="d"><a href="#queue" data-go="queue">확인 대기로 가기</a></span></div>
  </section>
  ${compass()}
  <div class="cols">
    <section class="panel" aria-labelledby="h-worst"><div class="panel-head"><h2 id="h-worst">불만 비율이 높은 제품</h2><span class="small muted">후기 ${MIN_N}건 이상</span></div>
      <ol class="rank">${worst.map(p => rankRow(p, badShare(p), `나쁨 ${fmt(p.sent[2])}개 · 주로 ${topNeg(p, 2).map(tagName).map(esc).join(', ') || '—'}`)).join('')}</ol>${keyRow()}</section>
    <section class="panel" aria-labelledby="h-best"><div class="panel-head"><h2 id="h-best">칭찬 비율이 높은 제품</h2><span class="small muted">후기 ${MIN_N}건 이상</span></div>
      <ol class="rank">${best.map(p => rankRow(p, goodShare(p), `좋음 ${fmt(p.sent[0])}개 · 후기 ${fmt(p.n)}건`)).join('')}</ol>${keyRow()}</section>
  </div>
  <section class="panel" aria-labelledby="h-month"><div class="panel-head"><div><h2 id="h-month">달마다 들어온 이야기</h2><p class="small muted">최근 24개월 · 막대에 마우스를 올리면 숫자가 나옵니다</p></div>${keyRow()}</div>${monthChart(M.monthly)}</section>
  <section class="panel" aria-labelledby="h-tags"><div class="panel-head"><div><h2 id="h-tags">어떤 점에서 불만이 나오나</h2><p class="small muted">회색은 그 주제가 나온 전체 횟수, 빨강은 그중 불만입니다</p></div><a href="#issues" data-go="issues" class="small">제품별로 보기</a></div>${hbars(tags, tmax)}</section>`;
}

// ── 보기: 제품별 ──
const st = { q: '', cat: '', sort: 'n', pilot: false, reqType: '', reqProd: '', reqQ: '', reqShow: 40, qShow: 40 };
function productRows() {
  let rows = P.filter(p => (st.pilot || !p.pilot) && (!st.cat || p.cats.includes(st.cat)) &&
    (!st.q || (p.name + ' ' + p.num + ' ' + p.mall.join(' ') + ' ' + p.partners.join(' ')).toLowerCase().includes(st.q.toLowerCase())));
  const s = { n: (a, b) => b.n - a.n, bad: (a, b) => (b.n >= 10) - (a.n >= 10) || badShare(b) - badShare(a), good: (a, b) => (b.n >= 10) - (a.n >= 10) || goodShare(b) - goodShare(a), last: (a, b) => b.last.localeCompare(a.last), num: (a, b) => a.num.localeCompare(b.num) }[st.sort];
  return rows.sort(s);
}
function vProducts() {
  const cats = [...new Set(P.flatMap(p => p.cats))];
  return `
  <header class="head"><div class="eyebrow">제품 ${P.filter(p => !p.pilot).length}개 · 파일럿 ${P.filter(p => p.pilot).length}개</div><h1>제품별 반응</h1>
    <p class="lead">줄을 누르면 그 제품의 좋았던 점과 아쉬운 점, 고객 요청을 볼 수 있습니다.</p></header>
  <div class="tools" role="search">
    <label class="field">찾기<input id="f-q" type="search" placeholder="제품명·번호·파트너사" value="${esc(st.q)}"></label>
    <label class="field">분류<select id="f-cat"><option value="">전체</option>${cats.map(c => `<option ${st.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
    <label class="field">줄 세우기<select id="f-sort">${[['n', '후기 많은 순'], ['bad', '불만 비율 높은 순'], ['good', '칭찬 비율 높은 순'], ['last', '최근 후기 순'], ['num', '번호 순']].map(([v, t]) => `<option value="${v}" ${st.sort === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="field">파일럿<select id="f-pilot"><option value="0">빼고 보기</option><option value="1" ${st.pilot ? 'selected' : ''}>함께 보기</option></select></label>
  </div>
  <div id="ptable"></div>
  <p class="small muted">비율로 줄 세울 때는 후기 10건 미만 제품을 뒤로 보냅니다. 후기가 적으면 한두 건에 비율이 크게 흔들리기 때문입니다.</p>`;
}
function renderPTable() {
  const rows = productRows(), el = $('#ptable'); if (!el) return;
  const tops = (o, n) => Object.keys(o || {}).slice(0, n);

// ── 보기: 제품 상세 ──

  ${insightBox(rows)}

// ── 보기: 불만 지도 ──
function vIssues() {

// ── 보기: 분류별 ──
function catGroups() {
  const cats = {};
  P.filter(p => !p.pilot).forEach(p => (p.cats.length ? p.cats : ['분류 없음']).forEach(c => (cats[c] = cats[c] || []).push(p)));
  return cats;
}
function catAgg(ps) {
  const pos = {}, neg = {}, ex = {}, best = {};
  ps.forEach(p => {
    Object.entries(p.pos || {}).forEach(([k, v]) => pos[k] = (pos[k] || 0) + v);
    Object.entries(p.neg || {}).forEach(([k, v]) => neg[k] = (neg[k] || 0) + v);
    Object.entries(p.tex || {}).forEach(([k, e]) => ['g', 'b'].forEach(s => {   // 대표 요약은 그 세분류가 가장 많은 제품에서
      const v = (s === 'g' ? p.pos : p.neg)[k] || 0;
      if (e[s] && v > (best[k + s] || 0)) { best[k + s] = v; (ex[k] = ex[k] || {})[s] = e[s].map(x => ({ ...x, s: `${p.name} · ${x.s}` })); }
    }));
  });
  return { pos, neg, ex };
}
function vCategories() {
  const order = Object.entries(catGroups()).sort((a, b) => b[1].reduce((s, p) => s + p.n, 0) - a[1].reduce((s, p) => s + p.n, 0));
  return `
  <header class="head"><div class="eyebrow">분류 ${order.length}개</div><h1>분류별 반응</h1>
    <p class="lead">분류 이름을 누르면 그 분류에서 무엇이 마음에 들었고 무엇이 아쉬웠는지 볼 수 있습니다.</p></header>
  <div class="pgrid">${order.map(([c, ps]) => {
    const a = catAgg(ps), n = ps.reduce((x, p) => x + p.n, 0);
    const g = Object.entries(a.pos).sort((x, y) => y[1] - x[1]).slice(0, 2).map(x => tagName(x[0])), b = Object.entries(a.neg).sort((x, y) => y[1] - x[1]).slice(0, 2).map(x => tagName(x[0]));
    return `<section class="panel"><div class="panel-head"><h2><button class="linkbtn" data-cat="${esc(c)}">${esc(c)}</button></h2><span class="small muted num">제품 ${ps.length}개 · 후기 ${fmt(n)}건</span></div>
      <div class="small">${g.length ? `<span class="muted">마음에 든 점</span> ${g.map(x => `<span class="chip good">${esc(x)}</span>`).join(' ')}` : ''}</div>
      <div class="small">${b.length ? `<span class="muted">마음에 안 든 점</span> ${b.map(x => `<span class="chip bad">${esc(x)}</span>`).join(' ')}` : ''}</div>
      <ul class="plist">${ps.sort((x, y) => y.n - x.n).slice(0, 6).map(p => `<li><button data-open="${esc(p.key)}">${thumb(p, 26)}<span class="nm">${esc(p.name)}</span></button>${sbar(p.sent, 8)}<span class="n">${fmt(p.n)}</span></li>`).join('')}</ul>
      <button class="more" data-cat="${esc(c)}" style="align-self:flex-start">${esc(c)} 자세히 보기</button></section>`;
  }).join('')}</div>`;
}
function vCategory(c) {
  const ps = (catGroups()[c] || []).sort((a, b) => b.n - a.n); if (!ps.length) return '<p>분류를 찾을 수 없습니다.</p>';
  const a = catAgg(ps), rows = tagStats(a.pos, a.neg), n = ps.reduce((x, p) => x + p.n, 0);
  return `
  ${backBtn('categories', '분류 목록')}
  <header class="head"><div class="eyebrow">분류 · 제품 ${ps.length}개 · 후기 ${fmt(n)}건</div><h1>${esc(c)}</h1></header>
  ${insightBox(rows)}
  ${likeDislike(rows, a.ex)}
  <section class="panel"><h2>${esc(c)} 제품</h2><div class="tbl-wrap" style="border:0"><table><thead><tr><th>제품</th><th class="r">후기</th><th>마음에 든 점</th><th>마음에 안 든 점</th></tr></thead><tbody>${ps.map(p => `<tr tabindex="0" data-open="${esc(p.key)}"><td><div class="pcell">${thumb(p, 36)}<b>${esc(p.name)}</b></div></td><td class="r">${fmt(p.n)}</td><td>${Object.keys(p.pos || {}).slice(0, 2).map(t => `<span class="chip good">${esc(tagName(t))}</span>`).join(' ') || '—'}</td><td>${Object.keys(p.neg || {}).slice(0, 2).map(t => `<span class="chip bad">${esc(tagName(t))}</span>`).join(' ') || '—'}</td></tr>`).join('')}</tbody></table></div></section>
  ${compass()}`;
}

// ── 보기: 파트너사별 ──
function vPartners() {

}

// ── 보기: 고객 요청 ──
function reqRows() {
  return D.todo.filter(r => (!st.reqType || r.i === st.reqType) && (!st.reqProd || r.p === st.reqProd) &&
    (!st.reqQ || (r.s + ' ' + (byKey[r.p]?.name || '')).includes(st.reqQ)));
}
function vRequests() {

  </div>
  <div class="tools">
    <label class="field">제품<select id="r-prod"><option value="">모든 제품</option>${P.filter(p => p.intent && Object.keys(p.intent).length).sort((a, b) => a.num.localeCompare(b.num)).map(p => `<option value="${esc(p.key)}" ${st.reqProd === p.key ? 'selected' : ''}>${esc(p.pilot ? '파일럿 ' + p.name : p.num + ' ' + p.name)}</option>`).join('')}</select></label>
    <label class="field">찾기<input id="r-q" type="search" placeholder="요약에 들어간 말" value="${esc(st.reqQ)}"></label>
  </div>
  <section class="panel" aria-live="polite"><div id="rlist"></div></section>`;
}
function renderReq() {
  const el = $('#rlist'); if (!el) return;
  const rows = reqRows();
  el.innerHTML = rows.length ? `<p class="small muted" style="margin:0">${fmt(rows.length)}건</p><div class="list">${rows.slice(0, st.reqShow).map(r => {
    const p = byKey[r.p];
    return `<div class="item"><span class="when">${esc(r.d)}</span><div class="what"><div class="meta"><span class="chip">${esc(INT_LABEL[r.i])}</span>${p ? `<button class="chip" data-open="${esc(p.key)}" style="cursor:pointer">${esc(p.name)}</button>` : ''}${r.v === 2 ? '<span class="chip bad">불만 섞임</span>' : ''}</div><span class="sum">${esc(r.s)}</span><a class="src" href="${esc(r.link)}" target="_blank" rel="noopener">원문 보기</a></div></div>`;
  }).join('')}</div>${rows.length > st.reqShow ? `<button class="more" id="r-more">${fmt(Math.min(40, rows.length - st.reqShow))}건 더 보기</button>` : ''}`
    : `<div class="empty">조건에 맞는 요청이 없습니다. 요청 종류를 «전체»로 바꾸거나 찾기 칸을 비워 보세요.</div>`;

// ── 보기: 확인 대기 ──
function vQueue() {
  const rows = D.queue;
  return `
  <header class="head"><div class="eyebrow">${fmt(rows.length)}건 · 최근 것부터</div><h1>사람이 확인할 후기</h1>
    <p class="lead">AI 판정 두 번이 서로 다르게 나온 후기입니다. 규칙상 어느 쪽이 맞는지 분명한 유형(교환·문의·거래 글, «오래 기다렸지만 좋다», 제품 제안, 작은 불만)은 자동으로 정리해서 여기에는 없습니다.</p></header>
  ${rows.length ? '' : '<section class="panel"><div class="empty">지금 확인할 후기가 없습니다. 새로 생기면 여기에 올라옵니다.</div></section>'}
  <section class="panel" ${rows.length ? '' : 'hidden'}><div class="list">${rows.slice(0, st.qShow).map(r => {
    const p = byKey[r.p];
    return `<div class="item"><span class="when">${esc(r.d)}</span><div class="what"><div class="meta">${p ? `<button class="chip" data-open="${esc(p.key)}" style="cursor:pointer">${esc(p.name)}</button>` : ''}</div>
      ${r.segs.map(s => `<span class="sum">${esc(s.s)}</span><span class="verdict">처음 판정 <span class="chip ${s.a === '긍정' ? 'good' : s.a === '부정' ? 'bad' : ''}">${SENT[['긍정', '중립', '부정'].indexOf(s.a)] || esc(s.a)}</span><span class="arrow" aria-hidden="true">→</span> 다시 본 판정 <span class="chip ${s.b === '긍정' ? 'good' : s.b === '부정' ? 'bad' : ''}">${SENT[['긍정', '중립', '부정'].indexOf(s.b)] || esc(s.b)}</span>${s.i === '재구매희망' ? '<span class="chip">다시 사고 싶음 · 새 규칙 확인 중</span>' : ''}</span>`).join('')}
      <span class="src">“${esc(r.c)}${r.c.length >= 220 ? '…' : ''}” <a href="${esc(r.link)}" target="_blank" rel="noopener">원문 보기</a></span></div></div>`;
  }).join('')}</div>${rows.length > st.qShow ? `<button class="more" id="q-more">${fmt(Math.min(40, rows.length - st.qShow))}건 더 보기</button>` : ''}</section>`;
}

// ── 라우팅 ──
const VIEWS = { overview: vOverview, products: vProducts, issues: vIssues, categories: vCategories, partners: vPartners, requests: vRequests, queue: vQueue };
let current = 'overview', openKey = null;
function go(view, key = null, push = true) {
  current = view; openKey = key; hideTip();
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.view === (view === 'product' ? 'products' : view === 'category' ? 'categories' : view) ? 'page' : 'false'));
  $('#view').innerHTML = view === 'product' ? vProduct(key) : view === 'category' ? vCategory(key) : VIEWS[view]();
  if (view === 'products') renderPTable();
  if (view === 'requests') renderReq();
  if (push) { try { history.replaceState(null, '', '#' + (view === 'product' ? 'products' : view === 'category' ? 'categories' : view)); } catch (e) {} }
  try { localStorage.setItem('intel-view', view === 'product' ? 'products' : view === 'category' ? 'categories' : view); } catch (e) {}
  scrollTo({ top: 0 });
  $('#main').focus({ preventScroll: true });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-go],[data-open],[data-cat],[data-req-prod],[data-rt],#r-more,#q-more');
  if (!t) return;
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.go) { e.preventDefault(); return go(t.dataset.go); }
  if (t.dataset.reqProd !== undefined) { e.preventDefault(); st.reqProd = t.dataset.reqProd; st.reqType = t.dataset.reqType || ''; st.reqQ = ''; st.reqShow = 40; return go('requests'); }
  if (t.dataset.open) return go('product', t.dataset.open);
  if (t.dataset.cat) return go('category', t.dataset.cat);
  if (t.dataset.rt !== undefined) { st.reqType = t.dataset.rt; st.reqShow = 40; document.querySelectorAll('[data-rt]').forEach(b => b.setAttribute('aria-pressed', b === t)); return renderReq(); }
  if (t.id === 'r-more') { st.reqShow += 40; return renderReq(); }
  if (t.id === 'q-more') { st.qShow += 40; return go('queue', null, false); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-open]')) { e.preventDefault(); go('product', e.target.dataset.open); }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'f-q') { st.q = e.target.value; renderPTable(); }
  if (id === 'r-q') { st.reqQ = e.target.value.trim(); st.reqShow = 40; renderReq(); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'f-cat') { st.cat = e.target.value; renderPTable(); }
  if (id === 'f-sort') { st.sort = e.target.value; renderPTable(); }
  if (id === 'f-pilot') { st.pilot = e.target.value === '1'; renderPTable(); }
  if (id === 'r-prod') { st.reqProd = e.target.value; st.reqShow = 40; go('requests', null); }
});

$('#brand-sub').textContent = `후기 ${fmt(M.reviews)}건 · ${M.updated?.slice(0, 10)} 기준`;
$('#b-products').textContent = P.filter(p => !p.pilot).length;
