<title>후기 판정 기준판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 줄 본문. 유형 카드 하나 = 질문 하나. 위에 진행 막대, 카드마다 «예시 → 고르기 → 덧붙일 말». 대시보드와 같은 청자빛. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunken:#eef2f0;
  --ink:#15201c; --ink-2:#3f4c48; --ink-3:#5d6a66; --line:#d9e0dd; --line-2:#c5cfcb;
  --accent:#1d6b5c; --accent-ink:#ffffff; --accent-soft:#e1efea;
  --good:#2a78d6; --neutral:#5f6966; --bad:#c9383a;
  --good-soft:#e3eefb; --neutral-soft:#eceeed; --bad-soft:#fbe7e6;
  --font-display:'Gowun Batang','Nanum Myeongjo',AppleMyungjo,ui-serif,Georgia,serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --fs-xs:12.5px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:17px; --fs-xl:22px; --fs-2xl:30px;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1312; --surface:#171c1b; --sunken:#1d2321;
  --ink:#eef3f1; --ink-2:#bdc7c3; --ink-3:#95a19c; --line:#2a3331; --line-2:#3a4542;
  --accent:#62c4ad; --accent-ink:#0b1210; --accent-soft:#1a2e29;
  --good:#5b9eec; --neutral:#9aa4a0; --bad:#ec7a77;
  --good-soft:#18263a; --neutral-soft:#242b29; --bad-soft:#3a1d1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1312; --surface:#171c1b; --sunken:#1d2321;
  --ink:#eef3f1; --ink-2:#bdc7c3; --ink-3:#95a19c; --line:#2a3331; --line-2:#3a4542;
  --accent:#62c4ad; --accent-ink:#0b1210; --accent-soft:#1a2e29;
  --good:#5b9eec; --neutral:#9aa4a0; --bad:#ec7a77;
  --good-soft:#18263a; --neutral-soft:#242b29; --bad-soft:#3a1d1c;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-underline-offset:3px}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.page{max-width:820px;margin:0 auto;padding-inline:clamp(16px,4vw,32px);padding-block:32px 96px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;line-height:1.3;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:var(--fs-xl);font-weight:700;margin:0;line-height:1.35;text-wrap:balance}
.lead{font-size:var(--fs-lg);color:var(--ink-2);margin:0;max-width:62ch}
.muted{color:var(--ink-3)}
.small{font-size:var(--fs-sm)}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);
  margin-inline:calc(-1 * clamp(16px,4vw,32px));padding:12px clamp(16px,4vw,32px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:var(--fs-sm)}
.prog-row b{font-size:var(--fs-md)}
.prog{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.save{font-size:var(--fs-xs);color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.save .d{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.save.ok .d{background:var(--accent)} .save.warn .d{background:var(--bad)}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0;padding:0;list-style:none}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:var(--fs-sm);color:var(--ink-2)}
.how b{display:block;color:var(--ink);font-size:var(--fs-md);margin-bottom:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:96px}
.card.done{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.card-head{display:flex;flex-direction:column;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);padding:2px 10px;border-radius:99px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.done{background:var(--accent-soft);color:var(--ink);font-weight:600}
.v{font-weight:600;padding:1px 8px;border-radius:99px;font-size:var(--fs-xs)}
.v.좋음{background:var(--good-soft);color:var(--ink)} .v.보통{background:var(--neutral-soft);color:var(--ink)} .v.나쁨{background:var(--bad-soft);color:var(--ink)}
.desc{margin:0;color:var(--ink-2)}

.ex{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.ex-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.ex-item .s{font-weight:600}
.ex-item .t{color:var(--ink-2);font-size:var(--fs-sm)}
.ex-item .m{font-size:var(--fs-xs);color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.ask{font-weight:600;font-size:var(--fs-lg);margin:0}
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.choice{position:relative;min-height:56px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:var(--fs-md)}
.choice:hover{background:var(--sunken)}
.choice .sub{font-size:var(--fs-xs);font-weight:400;color:var(--ink-3)}
.choice .rec{position:absolute;top:-9px;right:8px;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);line-height:18px}
.choice[aria-checked="true"]{border-color:transparent;color:var(--accent-ink)}
.choice[aria-checked="true"] .sub{color:inherit;opacity:.85}
.choice.좋음[aria-checked="true"]{background:var(--good)}
.choice.보통[aria-checked="true"]{background:var(--neutral)}
.choice.나쁨[aria-checked="true"]{background:var(--bad)}
.choice.each[aria-checked="true"]{background:var(--accent)}
.choice .ic{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:1px}
.choice.좋음 .ic{background:var(--good)} .choice.보통 .ic{background:var(--neutral)} .choice.나쁨 .ic{background:var(--bad)}
.choice[aria-checked="true"] .ic{background:var(--accent-ink)}

.memo{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-sm);color:var(--ink-2)}
.memo textarea{min-height:64px;resize:vertical;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:var(--fs-md);line-height:1.55}

details.all{border-top:1px solid var(--line);padding-top:10px}
details.all summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
details.all summary::-webkit-details-marker{display:none}
details.all summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.all[open] summary::before{transform:rotate(45deg)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .s{font-weight:600;font-size:var(--fs-sm)}
.row .t{font-size:var(--fs-sm);color:var(--ink-2)}
.row .m{font-size:var(--fs-xs);color:var(--ink-3)}
.mini{display:flex;gap:4px}
.mini button{min-width:52px;min-height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:var(--fs-sm);font-weight:600}
.mini button:hover{background:var(--sunken)}
.mini button[aria-pressed="true"].좋음{background:var(--good);border-color:transparent;color:var(--accent-ink)}
.mini button[aria-pressed="true"].보통{background:var(--neutral);border-color:transparent;color:var(--accent-ink)}
.mini button[aria-pressed="true"].나쁨{background:var(--bad);border-color:transparent;color:var(--accent-ink)}
.follow{font-size:var(--fs-xs);color:var(--ink-3)}
.row.need{background:linear-gradient(90deg,var(--bad-soft),transparent 60%)}

.finish{background:var(--accent-soft);border-radius:var(--r);padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.finish b{font-size:var(--fs-lg)}
.notice{background:var(--bad-soft);border-radius:10px;padding:12px 14px;font-size:var(--fs-sm)}

@media (max-width:640px){
  .how{grid-template-columns:minmax(0,1fr)}
  .choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:18px 16px}
  h1{font-size:25px}
  .row{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="page">
  <header style="display:flex;flex-direction:column;gap:10px">
    <div class="small muted">겸손몰 후기 · 확인 대기</div>
    <h1>애매한 후기, 유형마다 기준을 정해 주세요</h1>
    <p class="lead" id="lead"></p>
  </header>
  <ol class="how">
    <li><b>예시를 읽고</b>유형마다 실제 후기 3개를 보여 드립니다.</li>
    <li><b>하나를 고르면</b>그 유형 전체가 그 판정으로 정해집니다. 바로 저장됩니다.</li>
    <li><b>예외만 따로</b>«모두 보기»를 열어 몇 건만 다르게 고를 수 있습니다.</li>
  </ol>
  <div class="sticky" aria-live="polite">
    <div class="prog-row"><span><b id="p-types"></b> <span class="muted" id="p-items"></span></span><span class="save" id="save"><i class="d"></i><span>저장 연결 중…</span></span></div>
    <div class="prog" role="progressbar" aria-label="정한 유형" id="p-bar-wrap"><i id="p-bar" style="width:0"></i></div>
  </div>
  <div id="notice"></div>
  <div id="cards" style="display:flex;flex-direction:column;gap:22px"></div>
  <div class="finish" id="finish"></div>
</div>

<script id="types" type="application/json">__TYPES__</script>
<script>
(() => {
const TYPES = JSON.parse(document.getElementById('types').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const OPTS = [['좋음', '좋음으로', '좋은 반응'], ['보통', '보통으로', '평가 없음'], ['나쁨', '나쁨으로', '불만으로 셈'], ['each', '하나씩 볼게', '건마다 고르기']];
const docId = key => key.replace('#', '-');
const TOTAL = TYPES.reduce((a, t) => a + t.items.length, 0);

const state = { dec: {}, ovr: {} };   // dec[tid] = {choice, memo}; ovr[docId] = {sentiment}
let db = null, canSave = false;

// 한 문서에 한 번에 하나씩 쓰기
const chains = {};
function write(path, fn) {
  if (!db || !canSave) return;
  setSave('busy');
  chains[path] = (chains[path] || Promise.resolve()).then(fn).then(() => setSave('ok'), e => {
    if (e && e.code === 'invalid_argument') { canSave = false; setSave('ro'); } else setSave('err');
  });
}
function setSave(s) {
  const el = $('#save');
  const t = { busy: '저장 중…', ok: '저장됨 · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }), err: '저장하지 못했습니다. 잠시 뒤 다시 골라 주세요.', ro: '이 화면에서는 저장 권한이 없습니다', off: '저장 기능을 쓸 수 없어 이 화면에서만 기억합니다', wait: '저장 연결 중…' }[s];
  el.className = 'save ' + (s === 'ok' ? 'ok' : (s === 'err' || s === 'ro' || s === 'off') ? 'warn' : '');
  el.querySelector('span').textContent = t;
}

function effective(t, it) {
  const o = state.ovr[docId(it.key)];
  if (o && o.sentiment) return { v: o.sentiment, own: true };
  const c = state.dec[t.id]?.choice;
  return c && c !== 'each' ? { v: c, own: false } : { v: null, own: false };
}
function counts() {
  let types = 0, items = 0;
  TYPES.forEach(t => {
    const c = state.dec[t.id]?.choice;
    const allDone = t.items.every(it => effective(t, it).v);
    if (c && (c !== 'each' || allDone)) types++;
    items += t.items.filter(it => effective(t, it).v).length;
  });
  return { types, items };
}

function card(t) {
  const d = state.dec[t.id] || {};
  const c = d.choice;
  const uni = (k) => new Set(t.items.map(x => x[k])).size === 1 ? t.items[0][k] : null;
  const f = uni('first'), s = uni('second');
  const done = c && (c !== 'each' || t.items.every(it => effective(t, it).v));
  const seen = new Set(), ex = t.items.filter(it => !seen.has(it.id) && seen.add(it.id)).slice(0, 3);
  const open = c === 'each';
  return `<section class="card ${done ? 'done' : ''}" id="t-${t.id}" aria-labelledby="h-${t.id}">
    <div class="card-head">
      <div class="tags"><span class="chip">${t.items.length}건</span>${f && s ? `<span class="chip">처음 판정 <span class="v ${f}">${f}</span> → 다시 본 판정 <span class="v ${s}">${s}</span></span>` : ''}${done ? '<span class="chip done">정함</span>' : ''}</div>
      <h2 id="h-${t.id}">${esc(t.name)}</h2>
      <p class="desc">${esc(t.desc)}</p>
    </div>
    <div class="ex">${ex.map(it => `<div class="ex-item"><span class="s">${esc(it.summary)}</span><span class="t">“${esc(it.text)}${it.text.length >= 240 ? '…' : ''}”</span><span class="m">${esc(it.product)} · ${esc(it.date)} · <a href="${esc(it.link)}" target="_blank" rel="noopener">원문 보기</a></span></div>`).join('')}</div>
    <p class="ask" id="q-${t.id}">이런 이야기는 어떻게 셀까요?</p>
    <div class="choices" role="radiogroup" aria-labelledby="q-${t.id}">
      ${OPTS.map(([v, l, sub]) => `<button class="choice ${v}" role="radio" aria-checked="${c === v}" data-t="${t.id}" data-v="${v}">${t.rec === v ? '<span class="rec">추천</span>' : ''}<span>${v !== 'each' ? '<i class="ic" aria-hidden="true"></i>' : ''}${l}</span><span class="sub">${sub}</span></button>`).join('')}
    </div>
    <label class="memo" for="m-${t.id}">덧붙일 기준이 있으면 적어 주세요 <span class="muted">(선택 · 예: 석 달 넘게 걸렸으면 나쁨)</span><textarea id="m-${t.id}" data-memo="${t.id}" placeholder="말로 적어 주시면 그대로 규칙에 반영합니다">${esc(d.memo || '')}</textarea></label>
    <details class="all" ${open ? 'open' : ''} data-all="${t.id}"><summary>${t.items.length}건 모두 보기${open ? ' · 건마다 골라 주세요' : ' · 몇 건만 다르게 고르기'}</summary>
      <div>${t.items.map(it => row(t, it)).join('')}</div>
    </details>
  </section>`;
}
function row(t, it) {
  const e = effective(t, it), id = docId(it.key);
  const need = state.dec[t.id]?.choice === 'each' && !e.v;
  return `<div class="row ${need ? 'need' : ''}" id="r-${id}"><div><div class="s">${esc(it.summary)}</div><div class="t">“${esc(it.text)}${it.text.length >= 240 ? '…' : ''}”</div><div class="m">${esc(it.product)} · ${esc(it.date)} · 처음 ${esc(it.first)} / 다시 본 판정 ${esc(it.second)} · <a href="${esc(it.link)}" target="_blank" rel="noopener">원문 보기</a></div></div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><div class="mini" role="group" aria-label="이 후기 판정">${['좋음', '보통', '나쁨'].map(v => `<button class="${v}" aria-pressed="${e.v === v}" data-row="${id}" data-t="${t.id}" data-v="${v}">${v}</button>`).join('')}</div>
    <span class="follow">${e.own ? '이 건만 따로 고름 · <button data-clear="' + id + '" data-t="' + t.id + '" style="all:unset;cursor:pointer;color:var(--accent);text-decoration:underline">유형 기준 따르기</button>' : e.v ? '유형 기준을 따름' : '아직 안 고름'}</span></div></div>`;
}

function renderAll() {
  const openState = {};
  document.querySelectorAll('details[data-all]').forEach(d => openState[d.dataset.all] = d.open);
  const active = document.activeElement?.id;
  $('#cards').innerHTML = TYPES.map(card).join('');
  document.querySelectorAll('details[data-all]').forEach(d => { if (openState[d.dataset.all]) d.open = true; });
  if (active && active.startsWith('m-')) { const el = document.getElementById(active); if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } }
  renderProgress();
}
function renderProgress() {
  const { types, items } = counts();
  $('#p-types').textContent = `${TYPES.length}개 유형 중 ${types}개 정함`;
  $('#p-items').textContent = `· 후기 대목 ${TOTAL}개 중 ${items}개 결정`;
  $('#p-bar').style.width = (types / TYPES.length * 100) + '%';
  $('#p-bar-wrap').setAttribute('aria-valuenow', types); $('#p-bar-wrap').setAttribute('aria-valuemax', TYPES.length);
  $('#finish').innerHTML = types === TYPES.length
    ? `<b>다 정하셨습니다.</b><span>리뷰쟁이 창에 «기준판 다 했어»라고 말해 주세요. 고르신 기준대로 후기 ${TOTAL}개 대목을 고치고, 새 후기에도 같은 기준이 적용되도록 규칙을 바꾼 뒤 결과를 보여 드립니다.</span>`
    : `<b>남은 유형 ${TYPES.length - types}개</b><span>중간에 닫아도 고른 것은 저장됩니다. 다 고르신 뒤 리뷰쟁이 창에 «기준판 다 했어»라고 말해 주세요.</span>`;
}

$('#lead').textContent = `AI 판정 두 번이 서로 다르게 나온 후기 ${new Set(TYPES.flatMap(t => t.items.map(i => i.id))).size}건을 비슷한 것끼리 ${TYPES.length}묶음으로 나눴습니다. 묶음마다 하나만 고르시면 됩니다.`;
renderAll();

// 입력
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('choice')) {
    const t = b.dataset.t, v = b.dataset.v;
    const prev = state.dec[t] || {};
    state.dec[t] = { ...prev, choice: v };
    renderAll();
    if (v === 'each') { const d = document.querySelector(`details[data-all="${t}"]`); if (d) d.open = true; }
    write('decisions/' + t, () => db.doc('decisions/' + t).set({ choice: v, memo: state.dec[t].memo || '', at: new Date().toISOString() }));
    return;
  }
  if (b.dataset.row) {
    const id = b.dataset.row, v = b.dataset.v, t = TYPES.find(x => x.id === b.dataset.t);
    state.ovr[id] = { sentiment: v };
    renderAll();
    write('overrides/' + id, () => db.doc('overrides/' + id).set({ sentiment: v, type: t.id, at: new Date().toISOString() }));
    return;
  }
  if (b.dataset.clear) {
    const id = b.dataset.clear; delete state.ovr[id]; renderAll();
    write('overrides/' + id, () => db.doc('overrides/' + id).delete());
  }
});
const memoTimers = {};
function saveMemo(t, val) {
  const prev = state.dec[t] || {};
  if ((prev.memo || '') === val) return;
  state.dec[t] = { ...prev, memo: val };
  write('decisions/' + t, () => db.doc('decisions/' + t).set({ choice: state.dec[t].choice || '', memo: val, at: new Date().toISOString() }));
}
document.addEventListener('input', e => {
  const t = e.target.dataset.memo; if (!t) return;
  clearTimeout(memoTimers[t]); const val = e.target.value;
  memoTimers[t] = setTimeout(() => saveMemo(t, val), 900);
});
document.addEventListener('focusout', e => { const t = e.target.dataset?.memo; if (t) { clearTimeout(memoTimers[t]); saveMemo(t, e.target.value); } });

// 저장소 연결
(async () => {
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { setSave('off'); $('#notice').innerHTML = '<div class="notice">이 화면에서는 저장 기능을 쓸 수 없습니다. 고른 내용이 리뷰쟁이에게 전달되지 않으니, claude.ai에 로그인한 상태에서 열어 주세요.</div>'; return; }
  canSave = true; setSave('ok'); $('#save span').textContent = '연결됨 · 고르는 즉시 저장됩니다';
  const busy = () => document.activeElement && document.activeElement.dataset && document.activeElement.dataset.memo;
  db.collection('decisions').onSnapshot(snap => {
    snap.docs.forEach(d => { const x = d.data(); if (x) state.dec[d.id] = { choice: x.choice || undefined, memo: x.memo || '' }; });
    if (!busy()) renderAll(); else renderProgress();
  }, () => setSave('err'));
  db.collection('overrides').onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { const x = d.data(); if (x && x.sentiment) next[d.id] = { sentiment: x.sentiment }; });
    state.ovr = next;
    if (!busy()) renderAll(); else renderProgress();
  }, () => setSave('err'));
})();
})();
</script>
